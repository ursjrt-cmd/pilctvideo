<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PILCT - Premium Streaming, Video & Audio Platform</title>
  <script src="script.js" ></script>
  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-surface: #1f1f1f;
      --bg-hover: #272727;
      --accent: #ff0033;
      --text-main: #f1f1f1;
      --text-sub: #aaaaaa;
      --border-color: #333333;
      --header-bg: rgba(15, 15, 15, 0.95);
      --input-bg: #121212;
      --action-bg: #2b2b2b;
      --action-hover: #3f3f3f;
    }

    body.light-mode {
      --bg-main: #f9f9f9;
      --bg-surface: #ffffff;
      --bg-hover: #e5e5e5;
      --text-main: #121212;
      --text-sub: #606060;
      --border-color: #cccccc;
      --header-bg: rgba(255, 255, 255, 0.95);
      --input-bg: #f0f0f0;
      --action-bg: #f0f0f0;
      --action-hover: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background-color: var(--header-bg);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      transition: background-color 0.3s;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .brand-logo {
      background: linear-gradient(45deg, #ff0033, #ff5252);
      color: #fff;
      font-weight: 900;
      font-size: 20px;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Modern Search Bar */
    .search-bar {
      display: flex;
      align-items: center;
      width: 40%;
      max-width: 600px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2px 16px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .search-bar:focus-within {
      border-color: #3ea6ff;
      background-color: var(--bg-surface);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      fill: var(--text-sub);
      cursor: pointer;
      margin-right: 10px;
      flex-shrink: 0;
      transition: fill 0.2s;
    }

    .search-icon:hover {
      fill: var(--text-main);
    }

    .search-bar input {
      width: 100%;
      padding: 10px 0;
      background: transparent;
      border: none;
      color: var(--text-main);
      outline: none;
      font-size: 15px;
    }

    .header-actions-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.96); }

    .btn-icon {
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-primary { background-color: var(--accent); color: #fff; }
    .btn-secondary { background-color: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-danger { background-color: #d32f2f; color: white; }

    .action-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--action-bg);
      color: var(--text-main);
      transition: background 0.2s;
    }

    .action-btn:hover {
      background-color: var(--action-hover);
    }
    
    .action-btn.active {
      color: #3ea6ff;
    }

    .categories-bar {
      display: flex;
      gap: 10px;
      padding: 12px 24px;
      background-color: var(--bg-main);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 61px;
      z-index: 90;
    }

    .categories-bar::-webkit-scrollbar { display: none; }

    .chip {
      padding: 6px 14px;
      background-color: var(--bg-surface);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .chip:hover, .chip.active {
      background-color: var(--text-main);
      color: var(--bg-main);
      font-weight: 600;
    }

    .home-container, .profile-container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
    }

    .watch-container {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      padding: 24px;
      max-width: 1800px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1100px) { .watch-container { grid-template-columns: 1fr; } }

    .primary-content { display: flex; flex-direction: column; gap: 20px; }
    .player-wrapper { width: 100%; background-color: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
    .player-wrapper video, .player-wrapper audio { width: 100%; height: 100%; object-fit: contain; }
    
    .video-meta { display: flex; flex-direction: column; gap: 12px; }
    .video-title { font-size: 20px; font-weight: 700; }
    .video-stats { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    
    .channel-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .channel-info:hover { opacity: 0.8; }

    .video-interactions { display: flex; gap: 8px; align-items: center; }

    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #7928CA, #FF0080);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: white; overflow: hidden;
      background-size: cover; background-position: center; flex-shrink: 0;
      cursor: pointer;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-wrapper { cursor: pointer; transition: transform 0.2s; border-radius: 50%; overflow: hidden; background-color: var(--border-color); }
    .avatar-wrapper:hover { transform: scale(1.1); }

    .description-box { background-color: var(--bg-surface); padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; color: var(--text-main); word-break: break-word; }
    .description-box a { color: #3ea6ff; text-decoration: underline; }

    .section-header { font-size: 18px; font-weight: 700; margin: 16px 0 12px 0; display: flex; align-items: center; justify-content: space-between; }

    .video-grid { display: grid; gap: 20px; }
    .video-grid.full-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .video-grid.watch-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

    .video-card { background-color: var(--bg-surface); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }

    .thumbnail-container { position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: #000; display: flex; align-items: center; justify-content: center; }
    .thumbnail-container video, .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .thumbnail-container video { display: none; }
    .video-card:hover .thumbnail-container video { display: block; }
    .video-card:hover .thumbnail-container img { display: none; }

    .media-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.75); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; z-index: 2; }

    .card-details { padding: 12px; display: flex; gap: 10px; }
    .card-text { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .card-title { font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-author, .card-metrics { font-size: 12px; color: var(--text-sub); }
    
    .card-metrics-extra { display: flex; gap: 12px; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-top: 4px; align-items: center; }
    .card-metrics-extra svg { width: 14px; height: 14px; fill: currentColor; }

    .suggested-sidebar { display: flex; flex-direction: column; gap: 12px; }

    /* Profile View Styles */
    .profile-container { padding: 0; }
    .profile-banner { width: 100%; height: 250px; background-color: var(--border-color); background-size: cover; background-position: center; border-radius: 0 0 12px 12px; }
    
    /* Modified Profile Header to prevent overlap */
    .profile-header { display: flex; gap: 24px; padding: 24px 40px; align-items: flex-start; margin-top: 0; }
    .profile-avatar { 
      width: 120px; 
      height: 120px; 
      border-radius: 50%; 
      border: 4px solid var(--bg-main); 
      background-color: var(--border-color); 
      background-size: cover; 
      background-position: center; 
      flex-shrink: 0; 
      cursor: pointer;
      margin-top: -84px; /* Avatar overlaps the banner */
    }
    .profile-info { flex: 1; padding-bottom: 10px; }
    .profile-name { font-size: 32px; font-weight: bold; }
    .profile-bio { color: var(--text-sub); font-size: 14px; margin-top: 8px; max-width: 800px; word-break: break-word; }
    .profile-bio a { color: #3ea6ff; text-decoration: underline; }
    
    /* Styled Profile Links */
    .profile-links { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .profile-link-badge { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      background-color: var(--action-bg); 
      color: #3ea6ff; 
      padding: 6px 14px; 
      border-radius: 16px; 
      font-size: 13px; 
      font-weight: 600; 
      text-decoration: none; 
      transition: background-color 0.2s, transform 0.1s;
      border: 1px solid var(--border-color);
    }
    .profile-link-badge:hover { 
      background-color: var(--action-hover); 
      transform: translateY(-2px);
      text-decoration: none; 
    }
    
    .profile-nav { display: flex; gap: 24px; padding: 0 40px; border-bottom: 1px solid var(--border-color); }
    .profile-nav-item { padding: 16px 0; cursor: pointer; color: var(--text-sub); font-weight: 600; border-bottom: 3px solid transparent; transition: color 0.2s; }
    .profile-nav-item.active, .profile-nav-item:hover { color: var(--text-main); border-bottom-color: var(--text-main); }
    
    .profile-content { padding: 24px 40px; }
    .profile-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .profile-toolbar .categories-bar { position: static; border: none; padding: 0; background: transparent; }

    /* Custom Link Inputs inside Modal */
    .link-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .link-row input { flex: 1; }

    /* Auth Modals & Tabs */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background-color: var(--bg-surface); border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
    .modal-close { cursor: pointer; font-size: 20px; color: var(--text-sub); }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); outline: none; }
    
    .auth-tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
    .auth-tab { padding: 8px 16px; cursor: pointer; color: var(--text-sub); font-weight: 600; border-bottom: 2px solid transparent; }
    .auth-tab.active { color: var(--text-main); border-bottom-color: var(--accent); }
    
    /* Icons SVG Paths */
    .icon-like svg, .icon-share svg, .icon-star svg { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="brand-logo">P</div>
      <div class="brand-title">PILCT</div>
    </div>
    
    <!-- Modern Search Bar -->
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" onclick="handleSearch()">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search videos, audio, movies, creators..." onkeyup="handleSearch()">
    </div>

    <div class="header-actions-wrapper">
      <button class="btn btn-secondary btn-icon" onclick="toggleTheme()" id="themeToggle" title="Toggle Day/Night Mode">
      </button>
      <div class="user-actions" id="userActions"></div>
    </div>
  </header>

  <div class="categories-bar" id="categoriesBar"></div>

  <!-- HOME VIEW -->
  <div id="homeView" class="home-container">
    <div class="section-header" style="margin-top: 0;">
      <span id="homeSectionTitle">All Media</span>
    </div>
    <div class="video-grid full-grid" id="homeVideoGrid"></div>
  </div>

  <!-- WATCH / MEDIA PLAYER VIEW -->
  <div id="watchView" class="watch-container" style="display: none;">
    <div class="primary-content">
      <button class="btn btn-secondary" onclick="showHomeView()" style="align-self: flex-start; margin-bottom: 8px;">
        <svg style="width:16px; height:16px; fill:currentColor;" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> Back
      </button>
      <div class="player-wrapper" id="playerContainer"></div>
      <div class="video-meta">
        <div class="video-title" id="activeTitle">Select Media</div>
        <div class="video-stats">
          <div style="display: flex; gap: 16px; align-items: center;">
            <div class="channel-info" onclick="openProfile(currentVideo.authorId)">
              <div class="avatar" id="activeAvatar">P</div>
              <div>
                <div style="font-weight: 600;" id="activeAuthor">Author</div>
                <div style="font-size: 12px; color: var(--text-sub);" id="activeCategory">Category</div>
              </div>
            </div>
            <button class="btn btn-primary" onclick="alert('Subscribed successfully!')">Subscribe</button>
          </div>
          
          <div class="video-interactions" id="videoInteractions"></div>
        </div>
        <div class="description-box" id="activeDesc"></div>
      </div>
      <div class="section-header"><span>Trending & Related</span></div>
      <div class="video-grid watch-grid" id="watchTrendingGrid"></div>
    </div>
    <div class="suggested-sidebar">
      <div style="font-weight: 700; margin-bottom: 8px;">Up Next</div>
      <div id="suggestedList"></div>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="profile-container" style="display: none;">
    <div class="profile-banner" id="profileBanner"></div>
    
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar" onclick="openProfile(currentProfileId)"></div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">Channel Name</div>
        <div class="profile-bio" id="profileBio">Channel description goes here.</div>
        <div class="profile-links" id="profileLinks"></div>
      </div>
      <button class="btn btn-primary" onclick="alert('Subscribed!')">Subscribe</button>
    </div>

    <div class="profile-nav">
      <div class="profile-nav-item active" onclick="switchProfileTab('Home', this)">Home</div>
      <div class="profile-nav-item" onclick="switchProfileTab('Videos', this)">Videos</div>
      <div class="profile-nav-item" onclick="switchProfileTab('Audio', this)">Audio</div>
      <div class="profile-nav-item" onclick="switchProfileTab('Favorites', this)">Favorites ⭐</div>
    </div>

    <div class="profile-content">
      <div class="profile-toolbar">
        <div class="categories-bar" id="profileCategoriesBar"></div>
        <div class="search-bar" style="width: 300px; margin: 0;">
          <svg class="search-icon" viewBox="0 0 24 24" onclick="renderProfileVideos()">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="profileSearchInput" placeholder="Search user content..." onkeyup="renderProfileVideos()">
        </div>
      </div>
      <div class="video-grid full-grid" id="profileVideoGrid"></div>
    </div>
  </div>

  <!-- AUTH MODAL (REGISTER & LOGIN) -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="authTitle">User Account</span>
        <span class="modal-close" onclick="closeModal('authModal')">&times;</span>
      </div>
      
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="setAuthMode('login')">Login</div>
        <div class="auth-tab" id="tabRegister" onclick="setAuthMode('register')">Register</div>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="authEmail" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPass" placeholder="Enter password">
      </div>
      
      <button class="btn btn-primary" id="authSubmitBtn" onclick="processAuth()" style="justify-content:center;">Login</button>
      <div style="font-size: 11px; color: var(--text-sub); text-align: center;">Default Admin: Username: <b>jaki1993@</b> | Pass: <b>jaki1993@</b></div>
    </div>
  </div>

  <!-- UPLOAD MEDIA MODAL -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Upload Video / Audio</span>
        <span class="modal-close" onclick="closeModal('uploadModal')">&times;</span>
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="upTitle" placeholder="Enter title">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="upCategory">
          <option value="Movies">Movies</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Music">Music</option>
          <option value="Audio">Audio</option>
          <option value="Comedy">Comedy</option>
          <option value="Regional">Regional</option>
          <option value="International">International</option>
          <option value="News">News</option>
          <option value="Kids">Kids</option>
        </select>
      </div>
      <div class="form-group">
        <label>Media Type</label>
        <select id="upMediaType">
          <option value="video">Video (MP4, WEBM)</option>
          <option value="audio">Audio (MP3, WAV)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Choose Local File (MP3 / Video)</label>
        <input type="file" id="upFile" accept="video/*,audio/*" onchange="autoDetectMediaType(this)">
      </div>
      <div class="form-group">
        <label>OR Direct File URL</label>
        <input type="text" id="upUrl" placeholder="https://...mp4 or mp3">
      </div>
      <div class="form-group">
        <label>Poster / Cover Image URL (Optional)</label>
        <input type="text" id="upPoster" placeholder="https://...jpg">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="upDesc" rows="3" placeholder="Add description with links like https://mywebsite.com"></textarea>
      </div>
      <button class="btn btn-primary" onclick="processUpload()" style="justify-content:center;">Publish</button>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL (UPDATED FOR FILE UPLOADS) -->
  <div class="modal-overlay" id="channelModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Edit Profile & Channel</span>
        <span class="modal-close" onclick="closeModal('channelModal')">&times;</span>
      </div>
      <div class="form-group">
        <label>Channel Display Name</label>
        <input type="text" id="chName">
      </div>
      <div class="form-group">
        <label>Upload Logo / Avatar (From Device)</label>
        <input type="file" id="chLogoFile" accept="image/*">
        <label>OR Logo URL</label>
        <input type="text" id="chLogo" placeholder="https://...jpg">
      </div>
      <div class="form-group">
        <label>Upload Banner (From Device)</label>
        <input type="file" id="chBannerFile" accept="image/*">
        <label>OR Banner URL</label>
        <input type="text" id="chBanner" placeholder="https://...jpg">
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea id="chBio" rows="3" placeholder="Describe your channel..."></textarea>
      </div>
      
      <!-- Dynamic Clickable Custom Link Manager -->
      <div class="form-group">
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>Custom Profile Links</span>
          <button type="button" class="btn btn-secondary" onclick="addLinkInputRow()" style="padding: 2px 8px; font-size:11px;">+ Add Link</button>
        </label>
        <div id="customLinksContainer"></div>
      </div>

      <button class="btn btn-primary" onclick="saveChannelProfile()" style="justify-content:center;">Save Profile</button>
    </div>
  </div>

  <script>
    // SVG Icons Definitions
    const iconSun = `<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>`;
    const iconMoon = `<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>`;
    const iconLike = `<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`;
    const iconShare = `<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>`;
    const iconStarOutline = `<svg viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></svg>`;
    const iconStarFilled = `<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;

    const INITIAL_CATEGORIES = ['All', 'Audio', 'Movies', 'Entertainment', 'Music', 'Comedy', 'Regional', 'International', 'News', 'Kids'];
    
    let initialVideos = [
      { id: 'v1', mediaType: 'video', title: 'Big Buck Bunny', category: 'Kids', author: 'Blender Studio', authorId: 'blender', views: '1.2M views', timeAgo: '3 days ago', mediaUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', posterUrl: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&q=80', description: 'Classic 3D open animation. Visit official site at https://peach.blender.org for details!', likedBy: ['jaki1993@'], shares: 124 },
      { id: 'v2', mediaType: 'video', title: 'Sintel Short Movie', category: 'Movies', author: 'Blender Film', authorId: 'blender', views: '850K views', timeAgo: '1 week ago', mediaUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', posterUrl: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', description: 'Sci-fi fantasy short video. Learn more: https://durian.blender.org', likedBy: [], shares: 45 },
      { id: 'a1', mediaType: 'audio', title: 'Acoustic Folk Song (MP3)', category: 'Audio', author: 'PILCT Sound', authorId: 'jaki1993@', views: '45K plays', timeAgo: '2 hours ago', mediaUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', posterUrl: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80', description: 'Relaxing ambient audio stream. Check our playlists at https://soundcloud.com', likedBy: [], shares: 12 }
    ];

    let initialProfiles = {
      'jaki1993@': { channelName: 'PILCT Admin', logoUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80', bannerUrl: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=1200&q=80', bio: 'Official Admin account.', links: [{ title: 'Developer Portal', url: 'https://github.com' }, { title: 'Website', url: 'https://google.com' }], favorites: ['v1'] },
      'blender': { channelName: 'Blender Studio', logoUrl: 'https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=100&q=80', bannerUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&q=80', bio: 'Open source 3D creations.', links: [{ title: 'Blender Official', url: 'https://blender.org' }], favorites: [] }
    };

    let videos = JSON.parse(localStorage.getItem('pilct_videos')) || initialVideos;
    let profiles = JSON.parse(localStorage.getItem('pilct_profiles')) || initialProfiles;
    let users = JSON.parse(localStorage.getItem('pilct_users')) || [{ username: 'jaki1993@', pass: 'jaki1993@', isAdmin: true }];
    let currentUser = JSON.parse(localStorage.getItem('pilct_current_user')) || null;
    let activeCategory = 'All';
    let activeProfileCategory = 'All';
    let activeProfileTab = 'Home';
    let currentVideo = null;
    let currentProfileId = null;
    let authMode = 'login';

    window.onload = () => { initTheme(); renderHeaderActions(); renderCategories(); showHomeView(); };

    function initTheme() {
      const isLight = localStorage.getItem('pilct_theme') === 'light';
      if (isLight) document.body.classList.add('light-mode');
      document.getElementById('themeToggle').innerHTML = isLight ? iconMoon : iconSun;
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem('pilct_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeToggle').innerHTML = isLight ? iconMoon : iconSun;
    }

    function saveData() {
      localStorage.setItem('pilct_videos', JSON.stringify(videos));
      localStorage.setItem('pilct_profiles', JSON.stringify(profiles));
      localStorage.setItem('pilct_users', JSON.stringify(users));
      localStorage.setItem('pilct_current_user', JSON.stringify(currentUser));
    }

    function linkify(text) {
      if (!text) return '';
      const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
      let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return safeText.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g, '<br>');
    }

    function createVideoCardHTML(v) {
      let authorProfile = profiles[v.authorId] || { channelName: v.author, logoUrl: '' };
      let logoContent = authorProfile.logoUrl 
        ? `<img src="${authorProfile.logoUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
        : `<div style="font-size:11px; font-weight:bold;">${authorProfile.channelName.charAt(0)}</div>`;

      let mediaBadge = v.mediaType === 'audio' ? `<span class="media-badge">🎵 Audio</span>` : `<span class="media-badge">🎬 Video</span>`;
      let defaultCover = v.posterUrl || (v.mediaType === 'audio' ? 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80' : 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&q=80');

      let likesCount = v.likedBy ? v.likedBy.length : 0;
      let sharesCount = v.shares || 0;

      return `
        <div class="video-card" onclick="playVideo('${v.id}')" onmouseenter="hoverPlay(this)" onmouseleave="hoverStop(this)">
          ${mediaBadge}
          <div class="thumbnail-container">
            <img src="${defaultCover}">
            ${v.mediaType === 'video' ? `<video src="${v.mediaUrl}" loop muted preload="none"></video>` : ''}
          </div>
          <div class="card-details">
            <div class="avatar-wrapper" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;" onclick="event.stopPropagation(); openProfile('${v.authorId}')">
              ${logoContent}
            </div>
            <div class="card-text">
              <div class="card-title">${v.title}</div>
              <div class="card-author">${authorProfile.channelName}</div>
              <div class="card-metrics">${v.views} • ${v.timeAgo}</div>
              <div class="card-metrics-extra">
                <div style="display:flex; align-items:center; gap:4px;">${iconLike} ${likesCount}</div>
                <div style="display:flex; align-items:center; gap:4px;">${iconShare} ${sharesCount}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function showHomeView() {
      pauseCurrentMedia();
      document.getElementById('watchView').style.display = 'none';
      document.getElementById('profileView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('categoriesBar').style.display = 'flex';
      renderHomeVideos();
      window.scrollTo(0, 0);
    }

    function renderHomeVideos() {
      let query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = videos.filter(v => {
        let matchCat = (activeCategory === 'All') || 
                       (activeCategory === 'Audio' && v.mediaType === 'audio') || 
                       (v.category === activeCategory);
        let matchStr = v.title.toLowerCase().includes(query) || v.category.toLowerCase().includes(query);
        return matchCat && matchStr;
      });

      document.getElementById('homeSectionTitle').innerText = activeCategory === 'All' ? 'All Media Content' : `${activeCategory}`;
      document.getElementById('homeVideoGrid').innerHTML = filtered.length ? filtered.map(v => createVideoCardHTML(v)).join('') : `<div style="grid-column: 1/-1; color: var(--text-sub);">No content found.</div>`;
    }

    function playVideo(id) {
      const media = videos.find(v => v.id === id);
      if (!media) return;
      currentVideo = media;

      pauseCurrentMedia();

      document.getElementById('homeView').style.display = 'none';
      document.getElementById('profileView').style.display = 'none';
      document.getElementById('categoriesBar').style.display = 'none';
      document.getElementById('watchView').style.display = 'grid';
      
      const playerContainer = document.getElementById('playerContainer');
      
      if (media.mediaType === 'audio') {
        let cover = media.posterUrl || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80';
        playerContainer.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; background: radial-gradient(circle, #222 0%, #000 100%); padding:20px;">
            <img src="${cover}" style="width:160px; height:160px; border-radius:12px; object-fit:cover; margin-bottom:16px; box-shadow:0 8px 20px rgba(0,0,0,0.6);">
            <audio id="mainPlayer" controls autoplay style="width: 80%; max-width: 600px;">
              <source src="${media.mediaUrl}">
            </audio>
          </div>
        `;
      } else {
        playerContainer.innerHTML = `
          <video id="mainPlayer" controls autoplay style="width:100%; height:100%;">
            <source src="${media.mediaUrl}" type="video/mp4">
          </video>
        `;
      }
      
      let prof = profiles[media.authorId] || { channelName: media.author, logoUrl: '' };
      document.getElementById('activeTitle').innerText = media.title;
      document.getElementById('activeAuthor').innerText = prof.channelName;
      document.getElementById('activeDesc').innerHTML = linkify(media.description);
      document.getElementById('activeCategory').innerText = (media.mediaType === 'audio' ? '🎵 Audio' : '🎬 Video') + " • " + media.category + " • " + media.views;

      let avatarElem = document.getElementById('activeAvatar');
      if (prof.logoUrl) {
        avatarElem.innerHTML = `<img src="${prof.logoUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarElem.innerText = prof.channelName.charAt(0);
      }

      renderVideoActions();
      document.getElementById('watchTrendingGrid').innerHTML = videos.filter(v=>v.id !== id).map(v => createVideoCardHTML(v)).join('');
      window.scrollTo(0, 0);
    }

    function renderVideoActions() {
      const container = document.getElementById('videoInteractions');
      if (!currentVideo) return;

      if(!currentVideo.likedBy) currentVideo.likedBy = [];
      if(!currentVideo.shares) currentVideo.shares = 0;

      let isLiked = currentUser && currentVideo.likedBy.includes(currentUser.username);
      let isFav = currentUser && profiles[currentUser.username] && profiles[currentUser.username].favorites && profiles[currentUser.username].favorites.includes(currentVideo.id);

      container.innerHTML = `
        <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${currentVideo.id}')">
          <span class="icon-like">${iconLike}</span> <span id="watchLikeCount">${currentVideo.likedBy.length}</span>
        </button>
        <button class="action-btn" onclick="triggerShare('${currentVideo.id}')">
          <span class="icon-share">${iconShare}</span> <span id="watchShareCount">${currentVideo.shares}</span>
        </button>
        <button class="action-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${currentVideo.id}')" id="watchFavBtn">
          <span class="icon-star">${isFav ? iconStarFilled : iconStarOutline}</span> 
          <span>${isFav ? 'Saved' : 'Save'}</span>
        </button>
      `;
    }

    function toggleLike(id) {
      if (!currentUser) return alert('Please sign in to like content.');
      let vid = videos.find(v => v.id === id);
      if (!vid) return;

      if(!vid.likedBy) vid.likedBy = [];
      
      const idx = vid.likedBy.indexOf(currentUser.username);
      if (idx > -1) vid.likedBy.splice(idx, 1);
      else vid.likedBy.push(currentUser.username);

      saveData();
      renderVideoActions();
    }

    function triggerShare(id) {
      let vid = videos.find(v => v.id === id);
      if (!vid) return;
      vid.shares = (vid.shares || 0) + 1;
      saveData();
      renderVideoActions();
      alert(`Share link copied: ${window.location.href.split('?')[0]}?v=${id}`);
    }

    function toggleFavorite(id) {
      if (!currentUser) return alert('Please sign in to save to favorites.');
      let prof = profiles[currentUser.username];
      if (!prof.favorites) prof.favorites = [];

      const idx = prof.favorites.indexOf(id);
      if (idx > -1) prof.favorites.splice(idx, 1);
      else prof.favorites.push(id);
      
      saveData();
      renderVideoActions();
    }

    function openProfile(authorId) {
      pauseCurrentMedia();
      currentProfileId = authorId;
      activeProfileCategory = 'All';
      activeProfileTab = 'Home';
      
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('watchView').style.display = 'none';
      document.getElementById('categoriesBar').style.display = 'none';
      document.getElementById('profileView').style.display = 'block';

      let prof = profiles[authorId] || { channelName: authorId, logoUrl: '', bannerUrl: '', bio: '', links: [], favorites: [] };
      document.getElementById('profileName').innerText = prof.channelName;
      document.getElementById('profileBio').innerHTML = linkify(prof.bio || 'No profile bio added yet.');
      document.getElementById('profileBanner').style.backgroundImage = prof.bannerUrl ? `url(${prof.bannerUrl})` : 'none';
      
      const avatarDiv = document.getElementById('profileAvatar');
      avatarDiv.style.backgroundImage = prof.logoUrl ? `url(${prof.logoUrl})` : 'none';
      avatarDiv.innerText = prof.logoUrl ? '' : prof.channelName.charAt(0).toUpperCase();

      /* Render Clickable Custom Links in Profile Header */
      document.getElementById('profileLinks').innerHTML = (prof.links || []).map(l => 
        `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="profile-link-badge">
           <span>🌐</span> ${l.title || 'Link'}
         </a>`
      ).join('');

      document.querySelectorAll('.profile-nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector('.profile-nav-item').classList.add('active');

      renderProfileCategories();
      renderProfileVideos();
      window.scrollTo(0, 0);
    }

    function switchProfileTab(tabName, elem) {
      activeProfileTab = tabName;
      if (elem) {
        document.querySelectorAll('.profile-nav-item').forEach(el => el.classList.remove('active'));
        elem.classList.add('active');
      }
      renderProfileVideos();
    }

    function renderProfileCategories() {
      const bar = document.getElementById('profileCategoriesBar');
      bar.innerHTML = INITIAL_CATEGORIES.map(cat => `<div class="chip ${cat === activeProfileCategory ? 'active' : ''}" onclick="selectProfileCategory('${cat}')">${cat}</div>`).join('');
    }

    function selectProfileCategory(cat) {
      activeProfileCategory = cat;
      renderProfileCategories();
      renderProfileVideos();
    }

    function renderProfileVideos() {
      let query = document.getElementById('profileSearchInput').value.toLowerCase();
      let prof = profiles[currentProfileId] || {};
      let favIds = prof.favorites || [];

      let sourceVideos = activeProfileTab === 'Favorites' 
        ? videos.filter(v => favIds.includes(v.id)) 
        : videos.filter(v => v.authorId === currentProfileId);
      
      let filtered = sourceVideos.filter(v => {
        let matchTab = (activeProfileTab === 'Home') || 
                       (activeProfileTab === 'Favorites') ||
                       (activeProfileTab === 'Videos' && v.mediaType !== 'audio') || 
                       (activeProfileTab === 'Audio' && v.mediaType === 'audio');
        let matchCat = (activeProfileCategory === 'All') || (v.category === activeProfileCategory);
        let matchStr = v.title.toLowerCase().includes(query) || v.category.toLowerCase().includes(query);
        return matchTab && matchCat && matchStr;
      });

      const grid = document.getElementById('profileVideoGrid');
      grid.innerHTML = filtered.length ? filtered.map(v => createVideoCardHTML(v)).join('') : `<div style="grid-column: 1/-1; color: var(--text-sub);">No ${activeProfileTab.toLowerCase()} content found.</div>`;
    }

    function renderCategories() {
      document.getElementById('categoriesBar').innerHTML = INITIAL_CATEGORIES.map(cat => `<div class="chip ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</div>`).join('');
    }

    function selectCategory(cat) { activeCategory = cat; renderCategories(); showHomeView(); }
    function handleSearch() { if(document.getElementById('homeView').style.display === 'none') showHomeView(); renderHomeVideos(); }
    function resetToHome() { activeCategory = 'All'; document.getElementById('searchInput').value = ''; renderCategories(); showHomeView(); }

    function pauseCurrentMedia() {
      let player = document.getElementById('mainPlayer');
      if (player) { player.pause(); }
    }

    function renderHeaderActions() {
      const container = document.getElementById('userActions');
      if (currentUser) {
        let p = profiles[currentUser.username] || { channelName: currentUser.username, logoUrl: '' };
        let avatarContent = p.logoUrl 
          ? `<img src="${p.logoUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
          : p.channelName.charAt(0).toUpperCase();

        container.innerHTML = `
          <div class="avatar" style="width:36px;height:36px;font-size:14px;" onclick="openProfile('${currentUser.username}')" title="View Profile">
            ${avatarContent}
          </div>
          <button class="btn btn-secondary" onclick="openChannelModal()">Edit Profile</button>
          <button class="btn btn-primary" onclick="openModal('uploadModal')">+ Upload</button>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        `;
      } else {
        container.innerHTML = `<button class="btn btn-primary" onclick="openModal('authModal')">Sign In / Register</button>`;
      }
    }

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'Login' : 'Register';
    }

    function processAuth() {
      let u = document.getElementById('authEmail').value.trim();
      let p = document.getElementById('authPass').value.trim();
      if(!u || !p) return alert('Please enter both username and password.');

      let existing = users.find(x => x.username.toLowerCase() === u.toLowerCase());

      if (authMode === 'register') {
        if (existing) return alert('Username already registered! Please choose a different username or log in.');
        let newUser = { username: u, pass: p, isAdmin: false };
        users.push(newUser);
        currentUser = newUser;
        profiles[u] = { channelName: u, bio: 'Hello! Welcome to my channel.', links: [], favorites: [] };
        saveData();
        renderHeaderActions();
        closeModal('authModal');
        alert('Registration successful! Welcome to PILCT.');
      } else {
        if (!existing) return alert('Username not found. Please register first.');
        if (existing.pass !== p) return alert('Incorrect password.');
        currentUser = existing;
        saveData();
        renderHeaderActions();
        closeModal('authModal');
      }
    }

    function logout() { 
      currentUser = null; 
      saveData(); 
      renderHeaderActions(); 
      showHomeView(); 
    }

    function hoverPlay(el) { 
      let v = el.querySelector('video'); 
      if(v) { v.currentTime = 0; v.play().catch(()=>{}); } 
    }
    
    function hoverStop(el) { 
      let v = el.querySelector('video'); 
      if(v) v.pause(); 
    }

    function autoDetectMediaType(inputElem) {
      if (inputElem.files && inputElem.files[0]) {
        let file = inputElem.files[0];
        if (file.type.startsWith('audio/') || file.name.endsWith('.mp3')) {
          document.getElementById('upMediaType').value = 'audio';
          document.getElementById('upCategory').value = 'Audio';
        } else if (file.type.startsWith('video/')) {
          document.getElementById('upMediaType').value = 'video';
        }
      }
    }

    function processUpload() {
      if (!currentUser) return alert('Please sign in to upload.');
      
      let title = document.getElementById('upTitle').value.trim();
      if (!title) return alert('Title is required');

      let fileInput = document.getElementById('upFile');
      let directUrl = document.getElementById('upUrl').value.trim();
      let mediaType = document.getElementById('upMediaType').value;
      let finalMediaUrl = '';

      if (fileInput.files && fileInput.files[0]) {
        finalMediaUrl = URL.createObjectURL(fileInput.files[0]);
      } else if (directUrl) {
        finalMediaUrl = directUrl;
      } else {
        return alert('Please select an MP3/Video file to upload or enter a direct file URL.');
      }

      let authorProf = profiles[currentUser.username] || { channelName: currentUser.username };

      let newMedia = {
        id: 'm_' + Date.now(),
        mediaType: mediaType,
        title: title,
        category: document.getElementById('upCategory').value,
        author: authorProf.channelName,
        authorId: currentUser.username,
        views: '0 plays',
        timeAgo: 'Just now',
        mediaUrl: finalMediaUrl,
        posterUrl: document.getElementById('upPoster').value.trim(),
        description: document.getElementById('upDesc').value,
        likedBy: [],
        shares: 0
      };

      videos.unshift(newMedia);
      saveData();
      closeModal('uploadModal');
      
      document.getElementById('upTitle').value = '';
      document.getElementById('upUrl').value = '';
      document.getElementById('upDesc').value = '';
      document.getElementById('upFile').value = '';

      playVideo(newMedia.id);
    }

    /* CUSTOM LINK MANAGEMENT LOGIC WITH FILE UPLOADS */
    function openChannelModal() {
      if (!currentUser) return;
      let p = profiles[currentUser.username] || { channelName: currentUser.username, logoUrl: '', bannerUrl: '', bio: '', links: [] };
      
      document.getElementById('chName').value = p.channelName || currentUser.username;
      
      // Clear file inputs on modal open
      document.getElementById('chLogoFile').value = '';
      document.getElementById('chBannerFile').value = '';
      
      document.getElementById('chLogo').value = p.logoUrl || '';
      document.getElementById('chBanner').value = p.bannerUrl || '';
      document.getElementById('chBio').value = p.bio || '';

      const container = document.getElementById('customLinksContainer');
      container.innerHTML = '';

      if (p.links && p.links.length > 0) {
        p.links.forEach(link => addLinkInputRow(link.title, link.url));
      } else {
        addLinkInputRow(); // Default empty row
      }

      openModal('channelModal');
    }

    function addLinkInputRow(title = '', url = '') {
      const container = document.getElementById('customLinksContainer');
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <input type="text" placeholder="Title (e.g. Website)" value="${title}" class="link-title-input">
        <input type="text" placeholder="URL (https://...)" value="${url}" class="link-url-input">
        <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" style="padding: 6px 10px;">✕</button>
      `;
      container.appendChild(row);
    }

    function saveChannelProfile() {
      if (!currentUser) return;
      
      let currentFavs = profiles[currentUser.username] ? profiles[currentUser.username].favorites || [] : [];
      
      /* Process Logo Selection (File or URL) */
      let finalLogoUrl = document.getElementById('chLogo').value.trim();
      let logoFile = document.getElementById('chLogoFile').files[0];
      if (logoFile) {
        finalLogoUrl = URL.createObjectURL(logoFile);
      }

      /* Process Banner Selection (File or URL) */
      let finalBannerUrl = document.getElementById('chBanner').value.trim();
      let bannerFile = document.getElementById('chBannerFile').files[0];
      if (bannerFile) {
        finalBannerUrl = URL.createObjectURL(bannerFile);
      }
      
      /* Collect Dynamic Links */
      let customLinks = [];
      const linkRows = document.querySelectorAll('#customLinksContainer .link-row');
      linkRows.forEach(row => {
        let t = row.querySelector('.link-title-input').value.trim();
        let u = row.querySelector('.link-url-input').value.trim();
        if (u) {
          if (!u.startsWith('http://') && !u.startsWith('https://')) {
            u = 'https://' + u;
          }
          customLinks.push({ title: t || 'Link', url: u });
        }
      });

      profiles[currentUser.username] = {
        channelName: document.getElementById('chName').value || currentUser.username,
        logoUrl: finalLogoUrl,
        bannerUrl: finalBannerUrl,
        bio: document.getElementById('chBio').value,
        links: customLinks,
        favorites: currentFavs
      };

      saveData();
      renderHeaderActions();
      closeModal('channelModal');
      openProfile(currentUser.username);
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
