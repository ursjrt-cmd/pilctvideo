<html lang="en">
<head>

  <style>
    /* ALL ORIGINAL STYLES RETAINED + NEW STYLES FOR ADMIN & FAVORITES */
    :root {
      --bg-main: #0f0f0f;
      --bg-surface: #1f1f1f;
      --bg-hover: #272727;
      --accent: #ff0033;
      --text-main: #f1f1f1;
      --text-sub: #aaaaaa;
      --border-color: #333333;
      --header-bg: rgba(15, 15, 15, 0.95);
      --input-bg: #121212;
      --action-bg: #2b2b2b;
      --action-hover: #3f3f3f;
    }

    body.light-mode {
      --bg-main: #f9f9f9;
      --bg-surface: #ffffff;
      --bg-hover: #e5e5e5;
      --text-main: #121212;
      --text-sub: #606060;
      --border-color: #cccccc;
      --header-bg: rgba(255, 255, 255, 0.95);
      --input-bg: #f0f0f0;
      --action-bg: #f0f0f0;
      --action-hover: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background-color: var(--header-bg);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      transition: background-color 0.3s;
      flex-wrap: wrap; /* MOBILE OPTIMIZATION */
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .pilct-logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      font-family: 'Segoe UI Black', Impact, sans-serif;
    }
    
    .logo-p { color: #30b1ff; } /* Light Blue */
    .logo-i { color: #f7931e; } /* Orange */
    .logo-l { color: #fff200; } /* Yellow */
    .logo-c { color: #39b54a; } /* Green */
    .logo-t { color: #ffffff; text-shadow: 0 0 2px rgba(0,0,0,0.3); } /* White */
    
    body.light-mode .logo-t {
      color: #121212; /* Keep T visible in light mode */
      text-shadow: none;
    }

    .search-bar {
      display: flex;
      align-items: center;
      width: 40%;
      max-width: 600px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2px 16px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .search-bar:focus-within {
      border-color: #3ea6ff;
      background-color: var(--bg-surface);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      fill: var(--text-sub);
      cursor: pointer;
      margin-right: 10px;
      flex-shrink: 0;
      transition: fill 0.2s;
    }

    .search-icon:hover {
      fill: var(--text-main);
    }

    .search-bar input {
      width: 100%;
      padding: 10px 0;
      background: transparent;
      border: none;
      color: var(--text-main);
      outline: none;
      font-size: 15px;
    }

    .header-actions-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-icon {
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-primary { background-color: var(--accent); color: #fff; }
    .btn-secondary { background-color: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-danger { background-color: #d32f2f; color: white; }

    .action-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--action-bg);
      color: var(--text-main);
      transition: background 0.2s;
    }

    .action-btn:hover { background-color: var(--action-hover); }
    .action-btn.active { color: #3ea6ff; }

    .categories-bar {
      display: flex;
      gap: 10px;
      padding: 12px 24px;
      background-color: var(--bg-main);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 61px;
      z-index: 90;
    }

    .categories-bar::-webkit-scrollbar { display: none; }

    .chip {
      padding: 6px 14px;
      background-color: var(--bg-surface);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
    }

    .chip:hover, .chip.active {
      background-color: var(--text-main);
      color: var(--bg-main);
      font-weight: 600;
    }

    .home-container, .profile-container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
    }

    .watch-container {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      padding: 24px;
      max-width: 1800px;
      margin: 0 auto;
      width: 100%;
    }

    .primary-content { display: flex; flex-direction: column; gap: 20px; }
    .player-wrapper { width: 100%; background-color: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
    .player-wrapper video, .player-wrapper audio { width: 100%; height: 100%; object-fit: contain; }
    
    .video-meta { display: flex; flex-direction: column; gap: 12px; }
    .video-title { font-size: 20px; font-weight: 700; }
    .video-stats { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    
    .channel-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .channel-info:hover { opacity: 0.8; }

    .video-interactions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #7928CA, #FF0080);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: white; overflow: hidden;
      background-size: cover; background-position: center; flex-shrink: 0;
      cursor: pointer;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-wrapper { cursor: pointer; transition: transform 0.2s; border-radius: 50%; overflow: hidden; background-color: var(--border-color); }
    .avatar-wrapper:hover { transform: scale(1.1); }

    .description-box { background-color: var(--bg-surface); padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; color: var(--text-main); word-break: break-word; }
    .description-box a { color: #3ea6ff; text-decoration: underline; }

    .section-header { font-size: 18px; font-weight: 700; margin: 16px 0 12px 0; display: flex; align-items: center; justify-content: space-between; }

    .video-grid { display: grid; gap: 20px; }
    .video-grid.full-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .video-grid.watch-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

    .video-card { background-color: var(--bg-surface); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }

    .thumbnail-container { position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: #000; display: flex; align-items: center; justify-content: center; }
    .thumbnail-container video, .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .thumbnail-container video { display: none; }
    /* Mobile-specific: Disable hover play on mobile devices for performance */
    @media (hover: hover) and (pointer: fine) {
      .video-card:hover .thumbnail-container video { display: block; }
      .video-card:hover .thumbnail-container img { display: none; }
    }

    .media-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.75); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; z-index: 2; }
    
    .fav-btn { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #ffd700; padding: 6px; border-radius: 50%; z-index: 3; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; }
    .fav-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.1); }
    .fav-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .admin-del-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(220, 53, 69, 0.9); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index: 3; border: none; cursor: pointer; transition: background 0.2s; }
    .admin-del-btn:hover { background: #b02a37; }

    .card-details { padding: 12px; display: flex; gap: 10px; }
    .card-text { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .card-title { font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-author, .card-metrics { font-size: 12px; color: var(--text-sub); }
    
    .card-metrics-extra { display: flex; gap: 12px; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-top: 4px; align-items: center; }
    .card-metrics-extra svg { width: 14px; height: 14px; fill: currentColor; }

    .suggested-sidebar { display: flex; flex-direction: column; gap: 12px; }

    .profile-container { padding: 0; }
    .profile-banner { width: 100%; height: 250px; background-color: var(--border-color); background-size: cover; background-position: center; border-radius: 0 0 12px 12px; }
    
    .profile-header { display: flex; gap: 24px; padding: 24px 40px; align-items: flex-start; margin-top: 0; }
    .profile-avatar { 
      width: 120px; 
      height: 120px; 
      border-radius: 50%; 
      border: 4px solid var(--bg-main); 
      background-color: var(--border-color); 
      background-size: cover; 
      background-position: center; 
      flex-shrink: 0; 
      cursor: pointer;
      margin-top: -84px;
    }
    .profile-info { flex: 1; padding-bottom: 10px; }
    .profile-name { font-size: 32px; font-weight: bold; }
    .profile-bio { color: var(--text-sub); font-size: 14px; margin-top: 8px; max-width: 800px; word-break: break-word; }
    .profile-bio a { color: #3ea6ff; text-decoration: underline; }
    
    .profile-links { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .profile-link-badge { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      background-color: var(--action-bg); 
      color: #3ea6ff; 
      padding: 6px 14px; 
      border-radius: 16px; 
      font-size: 13px; 
      font-weight: 600; 
      text-decoration: none; 
      transition: background-color 0.2s, transform 0.1s;
      border: 1px solid var(--border-color);
    }
    .profile-link-badge:hover { 
      background-color: var(--action-hover); 
      transform: translateY(-2px);
      text-decoration: none; 
    }
    
    .profile-nav { display: flex; gap: 24px; padding: 0 40px; border-bottom: 1px solid var(--border-color); }
    .profile-nav-item { padding: 16px 0; cursor: pointer; color: var(--text-sub); font-weight: 600; border-bottom: 3px solid transparent; transition: color 0.2s; white-space: nowrap; }
    .profile-nav-item.active, .profile-nav-item:hover { color: var(--text-main); border-bottom-color: var(--text-main); }
    
    .profile-content { padding: 24px 40px; }
    .profile-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .profile-toolbar .categories-bar { position: static; border: none; padding: 0; background: transparent; }

    .link-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .link-row input { flex: 1; min-width: 120px; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; padding: 10px; }
    .modal-content { background-color: var(--bg-surface); border-radius: 12px; padding: 24px; width: 100%; max-width: 500px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
    .modal-close { cursor: pointer; font-size: 20px; color: var(--text-sub); }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); outline: none; }
    
    .auth-tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
    .auth-tab { padding: 8px 16px; cursor: pointer; color: var(--text-sub); font-weight: 600; border-bottom: 2px solid transparent; }
    .auth-tab.active { color: var(--text-main); border-bottom-color: var(--accent); }
    
    .icon-like svg, .icon-share svg, .icon-star svg { width: 18px; height: 18px; fill: currentColor; }

    /* ========================================= */
    /* MOBILE RESPONSIVE MEDIA QUERIES RETAINED & EXPANDED */
    /* ========================================= */
    @media (max-width: 1100px) { 
      .watch-container { grid-template-columns: 1fr; } 
    }

    @media (max-width: 768px) {
      header {
        padding: 10px 16px;
        gap: 12px;
      }
      .search-bar {
        width: 100%;
        max-width: 100%;
        order: 3;
        margin-top: 8px;
      }
      .brand { order: 1; }
      .header-actions-wrapper { order: 2; }
      
      .categories-bar { top: 110px; padding: 10px 16px; }
      
      .home-container, .watch-container { padding: 12px 16px; }
      
      .video-grid.full-grid { grid-template-columns: 1fr; }
      .video-grid.watch-grid { grid-template-columns: 1fr; }
      
      .profile-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 16px;
        gap: 16px;
      }
      
      .profile-avatar {
        margin-top: -60px;
        width: 100px;
        height: 100px;
      }
      
      .profile-links { justify-content: center; }
      
      .profile-nav {
        padding: 0 16px;
        gap: 16px;
        overflow-x: auto;
      }
      
      .profile-content { padding: 16px; }
      .profile-toolbar .search-bar { width: 100%; margin-top: 12px; }
      
      .btn { padding: 6px 12px; font-size: 13px; }
      .user-actions { gap: 8px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="pilct-logo">
        <span class="logo-p">P</span><span class="logo-i">I</span><span class="logo-l">L</span><span class="logo-c">C</span><span class="logo-t">T</span>
      </div>
    </div>
    
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" onclick="handleSearch()">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search videos, audio, movies, creators..." onkeyup="handleSearch()">
    </div>

    <div class="header-actions-wrapper">
      <button class="btn btn-secondary btn-icon" onclick="toggleTheme()" id="themeToggle" title="Toggle Day/Night Mode">
      </button>
      <div class="user-actions" id="userActions">
        <!-- Will dynamically render Sign In or Profile Button -->
      </div>
    </div>
  </header>

  <div class="categories-bar" id="categoriesBar"></div>

  <!-- HOME VIEW -->
  <div id="homeView" class="home-container">
    <div class="section-header" style="margin-top: 0;">
      <span id="homeSectionTitle">All Media</span>
    </div>
    <div class="video-grid full-grid" id="homeVideoGrid"></div>
  </div>

  <!-- WATCH / MEDIA PLAYER VIEW -->
  <div id="watchView" class="watch-container" style="display: none;">
    <div class="primary-content">
      <button class="btn btn-secondary" onclick="showHomeView()" style="align-self: flex-start; margin-bottom: 8px;">
        <svg style="width:16px; height:16px; fill:currentColor;" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> Back
      </button>
      <div class="player-wrapper" id="playerContainer"></div>
      <div class="video-meta">
        <div class="video-title" id="activeTitle">Select Media</div>
        <div class="video-stats">
          <div style="display: flex; gap: 16px; align-items: center;">
            <div class="channel-info" id="activeChannelWrapper">
              <div class="avatar" id="activeAvatar">P</div>
              <div>
                <div style="font-weight: 600;" id="activeAuthor">Author</div>
                <div style="font-size: 12px; color: var(--text-sub);" id="activeCategory">Category</div>
              </div>
            </div>
            <button class="btn btn-primary" onclick="alert('Subscribed successfully!')">Subscribe</button>
          </div>
          
          <div class="video-interactions" id="videoInteractions"></div>
        </div>
        <div class="description-box" id="activeDesc"></div>
      </div>
      <div class="section-header"><span>Trending & Related</span></div>
      <div class="video-grid watch-grid" id="watchTrendingGrid"></div>
    </div>
    <div class="suggested-sidebar">
      <div style="font-weight: 700; margin-bottom: 8px;">Up Next</div>
      <div id="suggestedList"></div>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="profile-container" style="display: none;">
    <div class="profile-banner" id="profileBanner"></div>
    
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar"></div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">Channel Name</div>
        <div class="profile-bio" id="profileBio">Channel description goes here.</div>
        <div class="profile-links" id="profileLinks"></div>
      </div>
      <div style="display:flex; gap:12px; align-items:center;" id="profileActionBtns">
        <button class="btn btn-primary" onclick="alert('Subscribed!')">Subscribe</button>
      </div>
    </div>

    <div class="profile-nav">
      <div class="profile-nav-item active" onclick="switchProfileTab('Home', this)">Home</div>
      <div class="profile-nav-item" onclick="switchProfileTab('Videos', this)">Videos</div>
      <div class="profile-nav-item" onclick="switchProfileTab('Audio', this)">Audio</div>
      <div class="profile-nav-item" onclick="switchProfileTab('Favorites', this)">Favorites</div>
    </div>

    <div class="profile-content">
      <div class="profile-toolbar">
        <div class="categories-bar" id="profileCategoriesBar"></div>
        <div class="search-bar" style="width: 300px; margin: 0;">
          <svg class="search-icon" viewBox="0 0 24 24" onclick="renderProfileVideos()">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="profileSearchInput" placeholder="Search user content..." onkeyup="renderProfileVideos()">
        </div>
      </div>
      <div class="video-grid full-grid" id="profileVideoGrid"></div>
    </div>
  </div>

  <!-- AUTH MODAL (REGISTER & LOGIN) -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="authTitle">User Account</span>
        <span class="modal-close" onclick="closeModal('authModal')">&times;</span>
      </div>
      
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="setAuthMode('login')">Login</div>
        <div class="auth-tab" id="tabRegister" onclick="setAuthMode('register')">Register</div>

  <div class="modal-overlay" id="channelModal">

  <script>
    // SVG Icons
    const iconSun = `<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>`;
    const iconMoon = `<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>`;
    const iconLike = `<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`;
    const iconShare = `<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>`;
    const iconStar = `<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
    const iconStarOutline = `<svg viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></svg>`;

    let INITIAL_CATEGORIES = ['All', 'Audio', 'Movies', 'Entertainment', 'Music', 'Comedy', 'Regional', 'International', 'News', 'Kids'];
    
    let videos = [];
    let currentUser = null;
    let currentUserProfile = null;
    let isAdmin = false;
    let userFavorites = [];

    let activeCategory = 'All';
    let activeProfileCategory = 'All';
    let activeProfileTab = 'Home';
    let currentVideo = null;
    let currentProfileId = null;
    let currentProfileData = null;
    let authMode = 'login';

    window.onload = async () => {
      initTheme();
      renderCategories();
      try {
        await initAuth();
        await fetchMediaFeed();
      } catch (e) {
        console.error("Initialization Error", e);
      } finally {
        renderHeaderActions();
        showHomeView();
      }
    };

    function initTheme() {
      const isLight = localStorage.getItem('pilct_theme') === 'light';
      if (isLight) document.body.classList.add('light-mode');
      document.getElementById('themeToggle').innerHTML = isLight ? iconMoon : iconSun;
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem('pilct_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeToggle').innerHTML = isLight ? iconMoon : iconSun;
    }

    // ====================
    // AUTHENTICATION
    // ====================
    async function initAuth() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      
      if (error) console.error("Session fetch error:", error);

      if (session) {
        currentUser = session.user;
        isAdmin = false; 
        await loadCurrentUserProfile();
        await loadFavorites();
      } else {
        currentUser = null;
        currentUserProfile = null;
        isAdmin = false;
        userFavorites = [];
      }
      
      renderHeaderActions();

      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (session && !isAdmin) {
          currentUser = session.user;
          await loadCurrentUserProfile();
          await loadFavorites();
        } else if (!isAdmin) {
          currentUser = null;
          currentUserProfile = null;
          userFavorites = [];
        }
        renderHeaderActions();
      });
    }

    async function loadCurrentUserProfile() {
      if (!currentUser || isAdmin) return;
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();
      
      if (!error && data) {
        currentUserProfile = data;
      } else {
        currentUserProfile = {
          id: currentUser.id,
          username: currentUser.user_metadata?.username || currentUser.email.split('@')[0],
          full_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
          avatar_url: '',
          banner_url: '',
          bio: ''
        };
      }
    }

    async function loadFavorites() {
      if (!currentUser || isAdmin) return;
      try {
        const { data, error } = await supabaseClient.from('favorites').select('media_id').eq('user_id', currentUser.id);
        if (!error && data) {
          userFavorites = data.map(f => f.media_id);
        }
      } catch (err) {
        console.warn('Favorites functionality may require setting up a "favorites" table in Supabase.', err);
      }
    }

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'Login' : 'Register';
      
      document.getElementById('fullNameGroup').style.display = mode === 'register' ? 'flex' : 'none';
      document.getElementById('usernameGroup').style.display = mode === 'register' ? 'flex' : 'none';
    }

    async function processAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value.trim();
      const submitBtn = document.getElementById('authSubmitBtn');

      if (!email || !password) return alert('Please enter both email/username and password.');

      // ADMIN BYPASS LOGIC
      if (authMode === 'login' && email === 'jrt9193@' && password === 'jrt9193@') {
          isAdmin = true;
          currentUser = { id: 'admin_123', email: 'admin' };
          currentUserProfile = { full_name: 'Super Admin', username: 'admin', avatar_url: '' };
          closeModal('authModal');
          renderHeaderActions();
          renderCategories(); // Show 'X' buttons
          renderHomeVideos();
          return;
      }

      submitBtn.disabled = true;
      try {
        if (authMode === 'register') {
          const username = document.getElementById('authUsername').value.trim() || email.split('@')[0];
          const fullName = document.getElementById('authFullName').value.trim() || username;

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { username, full_name: fullName } }
          });

          if (error) throw error;

          if (data.user) {
            const { error: profileError } = await supabaseClient.from('profiles').upsert([{
              id: data.user.id,
              username,
              full_name: fullName
            }]);
            
            if (profileError) {
                console.warn('Profile creation blocked by RLS.', profileError);
            }
          }

          alert('Registration successful! You may need to verify your email depending on your Supabase settings.');
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }

        closeModal('authModal');
      } catch (err) {
        alert('Authentication failed: ' + (err.message || 'Check your permissions.'));
      } finally {
        submitBtn.disabled = false;
      }
    }

    async function logout() {
      if (!isAdmin) {
        await supabaseClient.auth.signOut();
      }
      currentUser = null;
      currentUserProfile = null;
      isAdmin = false;
      userFavorites = [];
      renderHeaderActions();
      renderCategories(); // Hide 'X' buttons
      showHomeView();
    }

    // ====================
    // MEDIA FEED FETCHING
    // ====================
    async function fetchMediaFeed() {
      try {
        const { data, error } = await supabaseClient
          .from('media')
          .select(`
            *,
            profiles (id, username, full_name, avatar_url),
            likes (user_id),
            shares (id)
          `)
          .order('created_at', { ascending: false });

        if (error) throw error;

        videos = (data || []).map(item => ({
          id: item.id,
          mediaType: item.media_type || 'video',
          title: item.title,
          category: item.category || 'Movies',
          author: item.profiles?.full_name || item.profiles?.username || 'Creator',
          authorId: item.user_id,
          authorAvatar: item.profiles?.avatar_url || '',
          views: `${item.views_count || 0} views`,
          timeAgo: new Date(item.created_at).toLocaleDateString(),
          mediaUrl: item.media_url,
          posterUrl: item.poster_url,
          description: item.description || '',
          likedBy: (item.likes || []).map(l => l.user_id),
          shares: (item.shares || []).length
        }));

        renderHomeVideos();
      } catch (err) {
        console.error('Error fetching feed from Supabase:', err);
      }
    }

    // ====================
    // ADMIN FUNCTIONS
    // ====================
    
    function addNewCategory() {
      if (!isAdmin) return;
      const input = document.getElementById('newCategoryInput');
      const newCat = input.value.trim();
      
      if (newCat && !INITIAL_CATEGORIES.includes(newCat)) {
        INITIAL_CATEGORIES.push(newCat);
        
        renderCategories();
        if (document.getElementById('profileView').style.display === 'block') {
          renderProfileCategories();
        }
        
        const upCatSelect = document.getElementById('upCategory');
        const option = document.createElement('option');
        option.value = newCat;
        option.text = newCat;
        upCatSelect.appendChild(option);

        input.value = '';
        alert(`Category '${newCat}' added successfully!`);
      } else if (INITIAL_CATEGORIES.includes(newCat)) {
        alert('Category already exists.');
      }
    }

    function deleteCategory(catName) {
      if (!isAdmin) return;
      if (confirm(`Admin Action: Are you sure you want to delete the category '${catName}'?`)) {
        
        INITIAL_CATEGORIES = INITIAL_CATEGORIES.filter(c => c !== catName);
        
        if (activeCategory === catName) activeCategory = 'All';
        if (activeProfileCategory === catName) activeProfileCategory = 'All';
        
        const upCatSelect = document.getElementById('upCategory');
        for (let i = 0; i < upCatSelect.options.length; i++) {
          if (upCatSelect.options[i].value === catName) {
            upCatSelect.remove(i);
            break;
          }
        }

        renderCategories();
        if (document.getElementById('profileView').style.display === 'block') {
          renderProfileCategories();
        }
        renderHomeVideos();
        alert(`Category '${catName}' deleted successfully.`);
      }
    }

    async function deleteMediaItem(e, mediaId) {
      e.stopPropagation();
      if (!isAdmin) return;
      if (!confirm("Admin: Are you sure you want to permanently delete this media from Supabase?")) return;

      try {
        await supabaseClient.from('media').delete().eq('id', mediaId);
        videos = videos.filter(v => v.id !== mediaId);
        renderHomeVideos();
        if (document.getElementById('profileView').style.display === 'block') renderProfileVideos();
        alert("Media deleted successfully.");
      } catch(err) {
        alert("Failed to delete media: " + err.message);
      }
    }

    async function deleteCurrentUserProfile() {
      if (!isAdmin || !currentProfileId) return;
      if (!confirm("Admin: Are you sure you want to delete this user profile and ALL their media?")) return;

      try {
        await supabaseClient.from('media').delete().eq('user_id', currentProfileId);
        await supabaseClient.from('profiles').delete().eq('id', currentProfileId);
        
        videos = videos.filter(v => v.authorId !== currentProfileId);
        alert("User and their media successfully deleted from Supabase.");
        showHomeView();
      } catch(err) {
        alert("Failed to delete user: " + err.message);
      }
    }

    // ====================
    // UPLOAD LOGIC
    // ====================
    function autoDetectMediaType(inputElem) {
      if (inputElem.files && inputElem.files[0]) {
        let file = inputElem.files[0];
        if (file.type.startsWith('audio/') || file.name.endsWith('.mp3')) {
          document.getElementById('upMediaType').value = 'audio';
          document.getElementById('upCategory').value = 'Audio';
        } else if (file.type.startsWith('video/')) {
          document.getElementById('upMediaType').value = 'video';
        }
      }
    }

    async function processUpload() {
      if (!currentUser || isAdmin) return alert('Please sign in as a standard user to upload.');

      const title = document.getElementById('upTitle').value.trim();
      const mediaFile = document.getElementById('upFile').files[0];
      const posterFile = document.getElementById('upPosterFile').files[0];
      const posterUrlInput = document.getElementById('upPosterUrl').value.trim();
      const category = document.getElementById('upCategory').value;
      const mediaType = document.getElementById('upMediaType').value;
      const description = document.getElementById('upDesc').value.trim();
      const uploadBtn = document.getElementById('uploadSubmitBtn');

      if (!title) return alert('Title is required');
      if (!mediaFile) return alert('Please select a video or audio file to upload');

      uploadBtn.disabled = true;
      uploadBtn.innerText = 'Uploading to Supabase Storage...';

      try {
        const timestamp = Date.now();
        const userId = currentUser.id;

        const mediaExt = mediaFile.name.split('.').pop();
        const mediaPath = `${userId}/${timestamp}_media.${mediaExt}`;
        
        const { error: mediaErr } = await supabaseClient.storage
          .from('media_files')
          .upload(mediaPath, mediaFile);

        if (mediaErr) throw mediaErr;

        const { data: mediaUrlData } = supabaseClient.storage
          .from('media_files')
          .getPublicUrl(mediaPath);

        let finalPosterUrl = posterUrlInput;

        if (posterFile) {
          const posterExt = posterFile.name.split('.').pop();
          const posterPath = `${userId}/${timestamp}_poster.${posterExt}`;

          const { error: posterErr } = await supabaseClient.storage
            .from('images')
            .upload(posterPath, posterFile);

          if (!posterErr) {
            const { data: posterUrlData } = supabaseClient.storage
              .from('images')
              .getPublicUrl(posterPath);
            finalPosterUrl = posterUrlData.publicUrl;
          }
        }

        const { error: dbErr } = await supabaseClient
          .from('media')
          .insert([{
            user_id: userId,
            title,
            description,
            category,
            media_type: mediaType,
            media_url: mediaUrlData.publicUrl,
            poster_url: finalPosterUrl,
            views_count: 0
          }]);

        if (dbErr) throw dbErr;

        alert('Media successfully uploaded and stored in Supabase!');
        closeModal('uploadModal');
        await fetchMediaFeed();
      } catch (err) {
        alert('Upload failed: ' + (err.message || err));
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerText = 'Publish to Supabase';
      }
    }

    // ====================
    // PROFILE MANAGEMENT
    // ====================
    function openChannelModal() {
      if (!currentUser || isAdmin) return;
      const p = currentUserProfile || {};

      document.getElementById('chName').value = p.full_name || p.username || '';
      document.getElementById('chBio').value = p.bio || '';
      document.getElementById('chLogoFile').value = '';
      document.getElementById('chBannerFile').value = '';

      const container = document.getElementById('customLinksContainer');
      container.innerHTML = '';
      if (p.links && Array.isArray(p.links) && p.links.length > 0) {
        p.links.forEach(link => addLinkInputRow(link.title, link.url));
      } else {
        addLinkInputRow();
      }

      openModal('channelModal');
    }

    function addLinkInputRow(title = '', url = '') {
      const container = document.getElementById('customLinksContainer');
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <input type="text" placeholder="Title (e.g. Website)" value="${title}" class="link-title-input">
        <input type="text" placeholder="URL (https://...)" value="${url}" class="link-url-input">
        <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" style="padding: 6px 10px;">✕</button>
      `;
      container.appendChild(row);
    }

    async function saveChannelProfile() {
      if (!currentUser || isAdmin) return;

      const saveBtn = document.getElementById('saveProfileBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Saving to Supabase...';

      try {
        const userId = currentUser.id;
        const timestamp = Date.now();
        const fullName = document.getElementById('chName').value.trim();
        const bio = document.getElementById('chBio').value.trim();

        const logoFile = document.getElementById('chLogoFile').files[0];
        const bannerFile = document.getElementById('chBannerFile').files[0];

        let updates = {
          id: userId,
          full_name: fullName,
          bio: bio,
          updated_at: new Date()
        };

        if (logoFile) {
          const avatarPath = `${userId}/${timestamp}_avatar.${logoFile.name.split('.').pop()}`;
          const { error: logoErr } = await supabaseClient.storage
            .from('images')
            .upload(avatarPath, logoFile, { upsert: true });

          if (!logoErr) {
            const { data } = supabaseClient.storage.from('images').getPublicUrl(avatarPath);
            updates.avatar_url = data.publicUrl;
          }
        }

        if (bannerFile) {
          const bannerPath = `${userId}/${timestamp}_banner.${bannerFile.name.split('.').pop()}`;
          const { error: bannerErr } = await supabaseClient.storage
            .from('images')
            .upload(bannerPath, bannerFile, { upsert: true });

          if (!bannerErr) {
            const { data } = supabaseClient.storage.from('images').getPublicUrl(bannerPath);
            updates.banner_url = data.publicUrl;
          }
        }

        let customLinks = [];
        const linkRows = document.querySelectorAll('#customLinksContainer .link-row');
        linkRows.forEach(row => {
          let t = row.querySelector('.link-title-input').value.trim();
          let u = row.querySelector('.link-url-input').value.trim();
          if (u) {
            if (!u.startsWith('http://') && !u.startsWith('https://')) u = 'https://' + u;
            customLinks.push({ title: t || 'Link', url: u });
          }
        });
        updates.links = customLinks;

        const { error } = await supabaseClient
          .from('profiles')
          .upsert(updates);

        if (error) throw error;

        await loadCurrentUserProfile();
        closeModal('channelModal');
        await fetchMediaFeed();
        openProfile(userId);
      } catch (err) {
        alert('Profile update failed: ' + (err.message || err));
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Save Profile';
      }
    }

    // ====================
    // INTERACTION LOGIC
    // ====================
    async function toggleLike(mediaId) {
      if (!currentUser || isAdmin) return alert('Please sign in to like content.');
      
      try {
        const { data: existing } = await supabaseClient
          .from('likes')
          .select('*')
          .eq('user_id', currentUser.id)
          .eq('media_id', mediaId)
          .single();

        if (existing) {
          await supabaseClient.from('likes').delete().eq('user_id', currentUser.id).eq('media_id', mediaId);
        } else {
          await supabaseClient.from('likes').insert([{ user_id: currentUser.id, media_id: mediaId }]);
        }

        await fetchMediaFeed();
        if (currentVideo && currentVideo.id === mediaId) {
          currentVideo = videos.find(v => v.id === mediaId);
          renderVideoActions();
        }
      } catch (err) {
        console.error('Error toggling like:', err);
      }
    }

    async function toggleFav(e, mediaId) {
      e.stopPropagation();
      if (!currentUser) return alert('Please sign in to save favorites.');
      if (isAdmin) return alert('Admins cannot save favorites.');
      
      const isFav = userFavorites.includes(mediaId);
      try {
        if (isFav) {
          userFavorites = userFavorites.filter(id => id !== mediaId);
          await supabaseClient.from('favorites').delete().eq('user_id', currentUser.id).eq('media_id', mediaId);
        } else {
          userFavorites.push(mediaId);
          await supabaseClient.from('favorites').insert([{ user_id: currentUser.id, media_id: mediaId }]);
        }
        
        renderHomeVideos();
        if (document.getElementById('profileView').style.display === 'block') {
          renderProfileVideos();
        }
      } catch(err) {
        console.error("Error updating favorites", err);
      }
    }

    async function triggerShare(mediaId) {
      try {
        await supabaseClient.from('shares').insert([{ media_id: mediaId }]);
        await fetchMediaFeed();
        if (currentVideo && currentVideo.id === mediaId) {
          currentVideo = videos.find(v => v.id === mediaId);
          renderVideoActions();
        }
        alert(`Share link copied: ${window.location.href.split('?')[0]}?v=${mediaId}`);
      } catch (err) {
        console.error('Error tracking share:', err);
      }
    }

    // ====================
    // UI DISPLAY LOGIC
    // ====================
    function linkify(text) {
      if (!text) return '';
      const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
      let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return safeText.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g, '<br>');
    }

    function createVideoCardHTML(v) {
      let logoContent = v.authorAvatar 
        ? `<img src="${v.authorAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
        : `<div style="font-size:11px; font-weight:bold;">${v.author.charAt(0)}</div>`;

      let mediaBadge = v.mediaType === 'audio' ? `<span class="media-badge">🎵 Audio</span>` : `<span class="media-badge">🎬 Video</span>`;
      let defaultCover = v.posterUrl || (v.mediaType === 'audio' ? 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80' : 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&q=80');

      let favStatusIcon = userFavorites.includes(v.id) ? iconStar : iconStarOutline;
      let favButton = (!isAdmin && currentUser) ? `<div class="fav-btn" onclick="toggleFav(event, '${v.id}')" title="Save to Favorites">${favStatusIcon}</div>` : '';
      let adminDeleteButton = isAdmin ? `<button class="admin-del-btn" onclick="deleteMediaItem(event, '${v.id}')">🗑️ Delete</button>` : '';

      return `
        <div class="video-card" onclick="playVideo('${v.id}')" onmouseenter="hoverPlay(this)" onmouseleave="hoverStop(this)">
          ${favButton}
          ${mediaBadge}
          ${adminDeleteButton}
          <div class="thumbnail-container">
            <img src="${defaultCover}">
            ${v.mediaType === 'video' ? `<video src="${v.mediaUrl}" loop muted preload="none"></video>` : ''}
          </div>
          <div class="card-details">
            <div class="avatar-wrapper" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;" onclick="event.stopPropagation(); openProfile('${v.authorId}')">
              ${logoContent}
            </div>
            <div class="card-text">
              <div class="card-title">${v.title}</div>
              <div class="card-author">${v.author}</div>
              <div class="card-metrics">${v.views} • ${v.timeAgo}</div>
              <div class="card-metrics-extra">
                <div style="display:flex; align-items:center; gap:4px;">${iconLike} ${v.likedBy.length}</div>
                <div style="display:flex; align-items:center; gap:4px;">${iconShare} ${v.shares}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function showHomeView() {
      pauseCurrentMedia();
      document.getElementById('watchView').style.display = 'none';
      document.getElementById('profileView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('categoriesBar').style.display = 'flex';
      renderHomeVideos();
      window.scrollTo(0, 0);
    }

    function renderHomeVideos() {
      let query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = videos.filter(v => {
        let matchCat = (activeCategory === 'All') || 
                       (activeCategory === 'Audio' && v.mediaType === 'audio') || 
                       (v.category === activeCategory);
        let matchStr = v.title.toLowerCase().includes(query) || v.category.toLowerCase().includes(query);
        return matchCat && matchStr;
      });

      document.getElementById('homeSectionTitle').innerText = activeCategory === 'All' ? 'All Media Content' : `${activeCategory}`;
      document.getElementById('homeVideoGrid').innerHTML = filtered.length 
        ? filtered.map(v => createVideoCardHTML(v)).join('') 
        : `<div style="grid-column: 1/-1; color: var(--text-sub);">No media uploads found in Supabase.</div>`;
    }

    function playVideo(id) {
      const media = videos.find(v => v.id === id);
      if (!media) return;
      currentVideo = media;

      pauseCurrentMedia();

      document.getElementById('homeView').style.display = 'none';
      document.getElementById('profileView').style.display = 'none';
      document.getElementById('categoriesBar').style.display = 'none';
      document.getElementById('watchView').style.display = 'grid';
      
      const playerContainer = document.getElementById('playerContainer');
      
      if (media.mediaType === 'audio') {
        let cover = media.posterUrl || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80';
        playerContainer.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; background: radial-gradient(circle, #222 0%, #000 100%); padding:20px;">
            <img src="${cover}" style="width:160px; height:160px; border-radius:12px; object-fit:cover; margin-bottom:16px; box-shadow:0 8px 20px rgba(0,0,0,0.6);">
            <audio id="mainPlayer" controls autoplay style="width: 100%; max-width: 600px;">
              <source src="${media.mediaUrl}">
            </audio>
          </div>
        `;
      } else {
        playerContainer.innerHTML = `
          <video id="mainPlayer" controls autoplay style="width:100%; height:100%;">
            <source src="${media.mediaUrl}">
          </video>
        `;
      }
      
      document.getElementById('activeTitle').innerText = media.title;
      document.getElementById('activeAuthor').innerText = media.author;
      document.getElementById('activeDesc').innerHTML = linkify(media.description);
      document.getElementById('activeCategory').innerText = (media.mediaType === 'audio' ? '🎵 Audio' : '🎬 Video') + " • " + media.category;
      document.getElementById('activeChannelWrapper').onclick = () => openProfile(media.authorId);

      let avatarElem = document.getElementById('activeAvatar');
      if (media.authorAvatar) {
        avatarElem.innerHTML = `<img src="${media.authorAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarElem.innerText = media.author.charAt(0);
      }

      renderVideoActions();
      document.getElementById('watchTrendingGrid').innerHTML = videos.filter(v => v.id !== id).map(v => createVideoCardHTML(v)).join('');
      window.scrollTo(0, 0);
    }

    function renderVideoActions() {
      const container = document.getElementById('videoInteractions');
      if (!currentVideo) return;

      let isLiked = currentUser && currentVideo.likedBy.includes(currentUser.id);

      container.innerHTML = `
        <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${currentVideo.id}')">
          <span class="icon-like">${iconLike}</span> <span id="watchLikeCount">${currentVideo.likedBy.length}</span>
        </button>
        <button class="action-btn" onclick="triggerShare('${currentVideo.id}')">
          <span class="icon-share">${iconShare}</span> <span id="watchShareCount">${currentVideo.shares}</span>
        </button>
      `;
    }

    async function openProfile(authorId) {
      pauseCurrentMedia();
      currentProfileId = authorId;
      activeProfileCategory = 'All';
      activeProfileTab = 'Home';
      
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('watchView').style.display = 'none';
      document.getElementById('categoriesBar').style.display = 'none';
      document.getElementById('profileView').style.display = 'block';

      const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', authorId).single();
      currentProfileData = prof || { full_name: 'Creator', username: 'user', bio: '', avatar_url: '', banner_url: '', links: [] };

      document.getElementById('profileName').innerText = currentProfileData.full_name || currentProfileData.username;
      document.getElementById('profileBio').innerHTML = linkify(currentProfileData.bio || 'No profile bio added yet.');
      document.getElementById('profileBanner').style.backgroundImage = currentProfileData.banner_url ? `url(${currentProfileData.banner_url})` : 'none';
      
      const avatarDiv = document.getElementById('profileAvatar');
      avatarDiv.style.backgroundImage = currentProfileData.avatar_url ? `url(${currentProfileData.avatar_url})` : 'none';
      avatarDiv.innerText = currentProfileData.avatar_url ? '' : (currentProfileData.full_name || 'U').charAt(0).toUpperCase();

      document.getElementById('profileLinks').innerHTML = (currentProfileData.links || []).map(l => 
        `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="profile-link-badge">
           <span>🌐</span> ${l.title || 'Link'}
         </a>`
      ).join('');

      let adminBtns = isAdmin ? `<button class="btn btn-danger" onclick="deleteCurrentUserProfile()">🗑️ Delete User & Media</button>` : '';
      document.getElementById('profileActionBtns').innerHTML = `<button class="btn btn-primary" onclick="alert('Subscribed!')">Subscribe</button>` + adminBtns;

      document.querySelectorAll('.profile-nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector('.profile-nav-item').classList.add('active');

      renderProfileCategories();
      renderProfileVideos();
      window.scrollTo(0, 0);
    }

    function switchProfileTab(tabName, elem) {
      activeProfileTab = tabName;
      if (elem) {
        document.querySelectorAll('.profile-nav-item').forEach(el => el.classList.remove('active'));
        elem.classList.add('active');
      }
      renderProfileVideos();
    }

    function renderProfileCategories() {
      const bar = document.getElementById('profileCategoriesBar');
      if (activeProfileTab === 'Favorites') {
        bar.innerHTML = '';
      } else {
        bar.innerHTML = INITIAL_CATEGORIES.map(cat => {
          let deleteBtn = (isAdmin && cat !== 'All') ? `<span style="margin-left:8px; color:#ff5252; font-weight:bold; cursor:pointer;" onclick="event.stopPropagation(); deleteCategory('${cat}')">✕</span>` : '';
          return `<div class="chip ${cat === activeProfileCategory ? 'active' : ''}" onclick="selectProfileCategory('${cat}')">${cat}${deleteBtn}</div>`;
        }).join('');
      }
    }

    function selectProfileCategory(cat) {
      activeProfileCategory = cat;
      renderProfileCategories();
      renderProfileVideos();
    }

    function renderProfileVideos() {
      let query = document.getElementById('profileSearchInput').value.toLowerCase();
      let sourceVideos = [];

      if (activeProfileTab === 'Favorites') {
        sourceVideos = videos.filter(v => userFavorites.includes(v.id)); 
      } else {
        sourceVideos = videos.filter(v => v.authorId === currentProfileId);
      }
      
      let filtered = sourceVideos.filter(v => {
        if (activeProfileTab === 'Favorites') return v.title.toLowerCase().includes(query);

        let matchTab = (activeProfileTab === 'Home') || 
                       (activeProfileTab === 'Videos' && v.mediaType !== 'audio') || 
                       (activeProfileTab === 'Audio' && v.mediaType === 'audio');
        let matchCat = (activeProfileCategory === 'All') || (v.category === activeProfileCategory);
        let matchStr = v.title.toLowerCase().includes(query) || v.category.toLowerCase().includes(query);
        return matchTab && matchCat && matchStr;
      });

      const grid = document.getElementById('profileVideoGrid');
      grid.innerHTML = filtered.length 
        ? filtered.map(v => createVideoCardHTML(v)).join('') 
        : `<div style="grid-column: 1/-1; color: var(--text-sub);">${activeProfileTab === 'Favorites' ? 'No favorites saved yet.' : 'No media content found.'}</div>`;
    }

    function renderCategories() {
      document.getElementById('categoriesBar').innerHTML = INITIAL_CATEGORIES.map(cat => {
        let deleteBtn = (isAdmin && cat !== 'All') ? `<span style="margin-left:8px; color:#ff5252; font-weight:bold; cursor:pointer;" onclick="event.stopPropagation(); deleteCategory('${cat}')">✕</span>` : '';
        return `<div class="chip ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}${deleteBtn}</div>`;
      }).join('');
    }

    function selectCategory(cat) { activeCategory = cat; renderCategories(); showHomeView(); }
    function handleSearch() { if(document.getElementById('homeView').style.display === 'none') showHomeView(); renderHomeVideos(); }
    function resetToHome() { activeCategory = 'All'; document.getElementById('searchInput').value = ''; renderCategories(); showHomeView(); }

    function pauseCurrentMedia() {
      let player = document.getElementById('mainPlayer');
      if (player) { player.pause(); }
    }

    function renderHeaderActions() {
      const container = document.getElementById('userActions');
      if (currentUser) {
        let name = currentUserProfile?.full_name || currentUser.email.split('@')[0];
        let avatarContent = currentUserProfile?.avatar_url && !isAdmin
          ? `<img src="${currentUserProfile.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
          : name.charAt(0).toUpperCase();

        let adminAddCategory = isAdmin ? `
          <div style="display:flex; gap:6px; align-items:center; margin-right:12px;">
            <input type="text" id="newCategoryInput" placeholder="New Category" style="padding:6px 12px; border-radius:16px; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-main); font-size:12px; outline:none; width: 120px;">
            <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="addNewCategory()">Add</button>
          </div>
        ` : '';

        let extraButtons = isAdmin 
          ? `<span style="color:var(--accent); font-weight:bold; font-size:12px; margin-right:8px;">Admin Mode</span>` + adminAddCategory
          : `<button class="btn btn-secondary" onclick="openChannelModal()">Edit Profile</button>
             <button class="btn btn-primary" onclick="openModal('uploadModal')">+ Upload</button>`;

        let profileAction = isAdmin ? '' : `onclick="openProfile('${currentUser.id}')" title="View Profile"`;

        container.innerHTML = `
          ${extraButtons}
          <div class="avatar" style="width:36px;height:36px;font-size:14px;" ${profileAction}>
            ${avatarContent}
          </div>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        `;
      } else {
        container.innerHTML = `<button class="btn btn-primary" onclick="openModal('authModal')">Sign In / Register</button>`;
      }
    }

    function hoverPlay(el) { 
      // Only execute if pointer device can hover (fixes mobile scroll snapping)
      if (window.matchMedia('(hover: hover)').matches) {
        let v = el.querySelector('video'); 
        if(v) { v.currentTime = 0; v.play().catch(()=>{}); } 
      }
    }
    
    function hoverStop(el) { 
      let v = el.querySelector('video'); 
      if(v) v.pause(); 
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
