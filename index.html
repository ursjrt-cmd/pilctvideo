    header {

    .brand {

      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;

      font-weight: 900;
      letter-spacing: 1px;
      font-family: 'Segoe UI Black', Impact, sans-serif;

    .logo-c { color: #39b54a; }

    body.light-mode .logo-t {
      color: #121212; 
      text-shadow: none;
    }

    .search-bar {
      display: flex;
      align-items: center;
      width: 40%;
      max-width: 600px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2px 16px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .search-bar:focus-within {
      border-color: #3ea6ff;
      background-color: var(--bg-surface);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      fill: var(--text-sub);
      cursor: pointer;
      margin-right: 10px;
      flex-shrink: 0;
      transition: fill 0.2s;
    }

    .search-icon:hover {
      fill: var(--text-main);
    }

    .search-bar input {
      width: 100%;
      padding: 10px 0;
      background: transparent;
      border: none;
      color: var(--text-main);
      outline: none;
      font-size: 15px;
    }

    .header-actions-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;

      gap: 6px;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-icon {

      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

      height: 16px;
      fill: currentColor;
    }

      border: none;
      font-size: 14px;
      font-weight: 600;

    .action-btn:hover { background-color: var(--action-hover); }
    .action-btn.active { color: #3ea6ff; }

    .categories-bar {

      padding: 12px 24px;

      overflow-x: auto;
      white-space: nowrap;

      border-bottom: 1px solid var(--border-color);

      z-index: 90;

    .chip {
      padding: 6px 14px;
      background-color: var(--bg-surface);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;

      display: flex;
      align-items: center;
    }

    .chip:hover, .chip.active {

      margin: 0 auto;

    .player-logo-overlay .logo-l { color: #fff200; text-shadow: 0 2px 6px rgba(0,0,0,0.8); } 
    .player-logo-overlay .logo-c { color: #39b54a; text-shadow: 0 2px 6px rgba(0,0,0,0.8); } 
    .player-logo-overlay .logo-t { color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }

    body.light-mode .player-logo-overlay {
      background: transparent;
      box-shadow: none;
    }
    
    body.light-mode .player-logo-overlay .logo-t {
      color: #ffffff; 
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    
    .audio-player-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #2c2c2c 0%, #050505 100%);
      padding: 16px;
      box-sizing: border-box;
      position: absolute;
      top: 0;
      left: 0;

    .audio-cover-center {
      width: 100%;
      max-width: 220px;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      object-fit: cover;

    }

    .audio-controls-wrapper {
      width: 100%;
      max-width: 600px;
      padding: 0 10px;
    }

    .audio-controls-wrapper audio {
      width: 100%;
      height: 48px;
      outline: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    .video-meta { display: flex; flex-direction: column; gap: 12px; }
    .video-title { font-size: 20px; font-weight: 700; }
    .video-stats { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    
    .channel-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .channel-info:hover { opacity: 0.8; }

    .video-interactions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #7928CA, #FF0080);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: white; overflow: hidden;
      background-size: cover; background-position: center; flex-shrink: 0;
      cursor: pointer;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-wrapper { cursor: pointer; transition: transform 0.2s; border-radius: 50%; overflow: hidden; background-color: var(--border-color); }
    .avatar-wrapper:hover { transform: scale(1.1); }

    .description-box { background-color: var(--bg-surface); padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; color: var(--text-main); word-break: break-word; }
    .description-box a { color: #3ea6ff; text-decoration: underline; }

    .section-header { font-size: 18px; font-weight: 700; margin: 16px 0 12px 0; display: flex; align-items: center; justify-content: space-between; }

    .video-grid { display: grid; gap: 20px; }
    .video-grid.full-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .video-grid.watch-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

    .video-card { background-color: var(--bg-surface); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }

    .thumbnail-container { position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: #000; display: flex; align-items: center; justify-content: center; }
    .thumbnail-container video, .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .thumbnail-container video { display: none; }
    @media (hover: hover) and (pointer: fine) {
      .video-card:hover .thumbnail-container video { display: block; }
      .video-card:hover .thumbnail-container img { display: none; }
    }

    .media-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.75); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; z-index: 2; }
    
    .fav-btn { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #ffd700; padding: 6px; border-radius: 50%; z-index: 3; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; }
    .fav-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.1); }
    .fav-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .admin-del-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(220, 53, 69, 0.9); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index: 3; border: none; cursor: pointer; transition: background 0.2s; }
    .admin-del-btn:hover { background: #b02a37; }

    .card-details { padding: 12px; display: flex; gap: 10px; }
    .card-text { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .card-title { font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-author, .card-metrics { font-size: 12px; color: var(--text-sub); }
    
    .card-metrics-extra { display: flex; gap: 12px; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-top: 4px; align-items: center; }
    .card-metrics-extra svg { width: 14px; height: 14px; fill: currentColor; }

    .suggested-sidebar { display: flex; flex-direction: column; gap: 12px; }
    
    .compact-card {
      display: flex;
      gap: 12px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      background-color: var(--bg-surface);
      transition: background 0.2s, transform 0.2s;
      border: 1px solid transparent;
    }
    
    .compact-card:hover {
      background-color: var(--bg-hover);
      transform: translateY(-2px);
      border-color: var(--border-color);
    }
    
    .compact-thumb {
      width: 140px;
      flex-shrink: 0;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      background: #000;
    }
    
    .compact-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .compact-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-width: 0;
    }
    
    .compact-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
      color: var(--text-main);
    }
    
    .compact-author, .compact-metrics {
      font-size: 11px;
      color: var(--text-sub);
    }

    .profile-container { padding: 0; }
    .profile-banner { width: 100%; height: 250px; background-color: var(--border-color); background-size: cover; background-position: center; border-radius: 0 0 12px 12px; }
    
    .profile-header { display: flex; gap: 24px; padding: 24px 40px; align-items: flex-start; margin-top: 0; }
    .profile-avatar { 
      width: 120px; 
      height: 120px; 
      border-radius: 50%; 
      border: 4px solid var(--bg-main); 
      background-color: var(--border-color); 
      background-size: cover; 
      background-position: center; 
      flex-shrink: 0; 
      cursor: pointer;
      margin-top: -84px;
    }
    .profile-info { flex: 1; padding-bottom: 10px; }
    .profile-name { font-size: 32px; font-weight: bold; }
    .profile-bio { color: var(--text-sub); font-size: 14px; margin-top: 8px; max-width: 800px; word-break: break-word; }
    .profile-bio a { color: #3ea6ff; text-decoration: underline; }
    
    .profile-links { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .profile-link-badge { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      background-color: var(--action-bg); 
      color: #3ea6ff; 
      padding: 6px 14px; 
      border-radius: 16px; 
      font-size: 13px; 
      font-weight: 600; 
      text-decoration: none; 
      transition: background-color 0.2s, transform 0.1s;
      border: 1px solid var(--border-color);
    }
    .profile-link-badge:hover { 
      background-color: var(--action-hover); 
      transform: translateY(-2px);
      text-decoration: none; 
    }
    
    .profile-nav { display: flex; gap: 24px; padding: 0 40px; border-bottom: 1px solid var(--border-color); }
    .profile-nav-item { padding: 16px 0; cursor: pointer; color: var(--text-sub); font-weight: 600; border-bottom: 3px solid transparent; transition: color 0.2s; white-space: nowrap; }
    .profile-nav-item.active, .profile-nav-item:hover { color: var(--text-main); border-bottom-color: var(--text-main); }
    
    .profile-content { padding: 24px 40px; }
    .profile-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .profile-toolbar .categories-bar { position: static; border: none; padding: 0; background: transparent; }

    .link-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; width: 100%; }
    .link-row input { flex: 1; min-width: 120px; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; padding: 10px; }
    .modal-content { background-color: var(--bg-surface); border-radius: 12px; padding: 24px; width: 100%; max-width: 500px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
    .modal-close { cursor: pointer; font-size: 20px; color: var(--text-sub); }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); outline: none; }
    
    .auth-tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
    .auth-tab { padding: 8px 16px; cursor: pointer; color: var(--text-sub); font-weight: 600; border-bottom: 2px solid transparent; }
    .auth-tab.active { color: var(--text-main); border-bottom-color: var(--accent); }
    
    .icon-like svg, .icon-share svg, .icon-star svg { width: 18px; height: 18px; fill: currentColor; }

    @media (max-width: 1100px) { 
      .watch-container { grid-template-columns: 1fr; } 
    }

    @media (max-width: 768px) {
      header { padding: 10px 16px; gap: 12px; }
      .pilct-logo { font-size: 20px; }
      .search-bar { width: 100%; max-width: 100%; order: 3; margin-top: 8px; }
      .brand { order: 1; }

      .video-grid.full-grid, .video-grid.watch-grid { grid-template-columns: 1fr; }

      .profile-avatar { margin-top: -60px; width: 100px; height: 100px; }

      .profile-nav { padding: 0 16px; gap: 16px; overflow-x: auto; }
      .profile-content { padding: 16px; }
      .profile-toolbar .search-bar { width: 100%; margin-top: 12px; }
      
      .btn { padding: 6px 12px; font-size: 13px; }
      .user-actions { gap: 8px; }
      
      .compact-thumb { width: 120px; }

      .audio-cover-center { max-width: 140px; margin-bottom: 12px; }
      .audio-controls-wrapper audio { height: 40px; }
    }
  </style>

<body>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="pilct-logo">
        <span class="logo-p">P</span><span class="logo-i">I</span><span class="logo-l">L</span><span class="logo-c">C</span><span class="logo-t">T</span>
      </div>
    </div>
    
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" onclick="handleSearch()">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search videos, audio, movies, creators..." onkeyup="handleSearch()">

    <div class="header-actions-wrapper">
      <button class="btn btn-secondary btn-icon" onclick="toggleTheme()" id="themeToggle" title="Toggle Day/Night Mode"></button>
      <div class="user-actions" id="userActions"></div>
    </div>

    let INITIAL_CATEGORIES = ['All', 'Audio', 'Movies', 'Entertainment', 'Music', 'Comedy', 'Regional', 'International', 'News', 'Kids'];

    function initTheme() {
      const isLight = localStorage.getItem('pilct_theme') === 'light';
      if (isLight) document.body.classList.add('light-mode');
      document.getElementById('themeToggle').innerHTML = isLight ? iconMoon : iconSun;

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem('pilct_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeToggle').innerHTML = isLight ? iconMoon : iconSun;
    }

    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        await loadCurrentUserProfile();
        await loadFavorites();
      }
      
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (session && !isAdmin) {
          currentUser = session.user;
          await loadCurrentUserProfile();
          await loadFavorites();
        } else if (!isAdmin) {
          currentUser = null; currentUserProfile = null; userFavorites = [];
        }
        renderHeaderActions();
      });
    }

    async function loadCurrentUserProfile() {
      if (!currentUser || isAdmin) return;
      const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      if (!error && data) {
        currentUserProfile = data;
      } else {
        currentUserProfile = { id: currentUser.id, username: currentUser.email.split('@')[0], full_name: currentUser.email.split('@')[0], avatar_url: '', banner_url: '', bio: '' };
      }
    }

    async function loadFavorites() {
      if (!currentUser || isAdmin) return;
      const { data, error } = await supabaseClient.from('favorites').select('media_id').eq('user_id', currentUser.id);
      if (!error && data) userFavorites = data.map(f => f.media_id);
    }

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'Login' : 'Register';
      document.getElementById('fullNameGroup').style.display = mode === 'register' ? 'flex' : 'none';
      document.getElementById('usernameGroup').style.display = mode === 'register' ? 'flex' : 'none';
    }

    async function processAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value.trim();
      if (!email || !password) return alert('Enter email/username and password.');

      if (authMode === 'login' && email === 'jrt9193@' && password === 'jrt9193@') {
          isAdmin = true;
          currentUser = { id: 'admin_123', email: 'admin' };
          currentUserProfile = { full_name: 'Super Admin', username: 'admin', avatar_url: '' };
          closeModal('authModal');
          renderHeaderActions();
          renderCategories(); 
          renderHomeVideos();
          return;
      }

      document.getElementById('authSubmitBtn').disabled = true;
      try {
        if (authMode === 'register') {
          const username = document.getElementById('authUsername').value.trim() || email.split('@')[0];
          const fullName = document.getElementById('authFullName').value.trim() || username;
          const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { username, full_name: fullName } } });
          if (error) throw error;
          if (data.user) {
            await supabaseClient.from('profiles').upsert([{ id: data.user.id, username, full_name: fullName }]);
          }
          alert('Registration successful!');
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
        closeModal('authModal');
      } catch (err) {
        alert('Authentication failed: ' + (err.message));
      } finally {
        document.getElementById('authSubmitBtn').disabled = false;
      }
    }

    async function logout() {
      if (!isAdmin) await supabaseClient.auth.signOut();
      currentUser = null; currentUserProfile = null; isAdmin = false; userFavorites = [];
      renderHeaderActions(); renderCategories(); showHomeView();
    }

    async function fetchMediaFeed() {
      try {
        const { data, error } = await supabaseClient.from('media')
          .select(`*, profiles (id, username, full_name, avatar_url), likes (user_id), shares (id)`)
          .order('created_at', { ascending: false });
        if (error) throw error;

        videos = (data || []).map(item => ({
          id: item.id,
          mediaType: item.media_type || 'video',
          title: item.title,
          category: item.category || 'Movies',
          author: item.profiles?.full_name || item.profiles?.username || 'Creator',
          authorId: item.user_id,
          authorAvatar: item.profiles?.avatar_url || '',
          views: `${item.views_count || 0} views`,
          timeAgo: new Date(item.created_at).toLocaleDateString(),
          mediaUrl: item.media_url,
          posterUrl: item.poster_url,
          description: item.description || '',
          likedBy: (item.likes || []).map(l => l.user_id),
          shares: (item.shares || []).length
        }));
        renderHomeVideos();
      } catch (err) { console.error('Error fetching feed:', err); }
    }

    async function deleteMediaItem(e, mediaId) {
      e.stopPropagation();
      if (!currentUser && !isAdmin) return alert("You must be logged in to delete posts.");
      const media = videos.find(v => v.id === mediaId);
      if (!media) return;
      if (!isAdmin && currentUser.id !== media.authorId) return alert("You can only delete your own posts.");
      if (!confirm("Are you sure you want to permanently delete this media from Supabase?")) return;

      try {
        const { error } = await supabaseClient.from('media').delete().eq('id', mediaId);
        if (error) throw error;
        videos = videos.filter(v => v.id !== mediaId);
        renderHomeVideos();
        if (document.getElementById('profileView').style.display === 'block') renderProfileVideos();
        if (currentVideo && currentVideo.id === mediaId) {
          showHomeView();
        } else if (currentVideo) {
          renderSidebar();
        }
        alert("Media deleted successfully.");
      } catch(err) { alert("Failed to delete media: " + err.message); }
    }

    function autoDetectMediaType(inputElem) {
      if (inputElem.files && inputElem.files[0]) {
        let file = inputElem.files[0];
        if (file.type.startsWith('audio/') || file.name.endsWith('.mp3')) {
          document.getElementById('upMediaType').value = 'audio';
          document.getElementById('upCategory').value = 'Audio';
        } else if (file.type.startsWith('video/')) {
          document.getElementById('upMediaType').value = 'video';
        }
      }
    }
    
    function autoDetectUrlType(url) {
      const lowerUrl = url.toLowerCase();
      if (lowerUrl.endsWith('.mp3') || lowerUrl.endsWith('.wav') || lowerUrl.endsWith('.ogg')) {
        document.getElementById('upMediaType').value = 'audio';
        document.getElementById('upCategory').value = 'Audio';
      } else if (lowerUrl.endsWith('.mp4') || lowerUrl.endsWith('.webm') || lowerUrl.endsWith('.mkv') || lowerUrl.includes('drive.google.com') || lowerUrl.includes('dropbox.com')) {
        document.getElementById('upMediaType').value = 'video';
      }
    }

    // Helper Function to Transform Google Drive & Dropbox Share Links to Direct Streamable Links
    function transformExternalMediaUrl(url) {
      if (!url) return url;
      
      // Google Drive link transformation (converts share links to direct download/stream links)
      const gDriveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (gDriveMatch && gDriveMatch[1]) {
        return `https://drive.google.com/uc?export=download&id=${gDriveMatch[1]}`;
      }
      
      // Dropbox link transformation (converts dl=0 to raw=1 for streaming)
      if (url.includes('dropbox.com')) {
        return url.replace('dl=0', 'raw=1');
      }
      
      return url;
    }

    async function processUpload() {
      if (!currentUser || isAdmin) return alert('Please sign in as a standard user to upload.');

      const title = document.getElementById('upTitle').value.trim();
      const mediaFile = document.getElementById('upFile').files[0];
      const directMediaUrl = document.getElementById('upDirectMediaUrl').value.trim();
      const posterFile = document.getElementById('upPosterFile').files[0];
      const posterUrlInput = document.getElementById('upPosterUrl').value.trim();
      const category = document.getElementById('upCategory').value;
      const mediaType = document.getElementById('upMediaType').value;
      const baseDescription = document.getElementById('upDesc').value.trim();
      const customLinkUrl = document.getElementById('upCustomLinkUrl').value.trim();
      const customLinkText = document.getElementById('upCustomLinkText').value.trim() || customLinkUrl;
      const uploadBtn = document.getElementById('uploadSubmitBtn');

      if (!title) return alert('Title is required');
      if (!mediaFile && !directMediaUrl) return alert('Select a local file or enter a direct external URL to upload');

      // Append Custom Link to description safely
      let finalDescription = baseDescription;
      if (customLinkUrl) {
        finalDescription += `\n\n🔗 ${customLinkText} \n${customLinkUrl}`;
      }

      uploadBtn.disabled = true; uploadBtn.innerText = 'Uploading...';

      try {
        const timestamp = Date.now();
        // Automatically parse direct external urls to playable streams
        let finalMediaUrl = transformExternalMediaUrl(directMediaUrl);

        // Process File if provided (overrides URL)
        if (mediaFile) {
          const mediaPath = `${currentUser.id}/${timestamp}_media.${mediaFile.name.split('.').pop()}`;
          const { error: mediaErr } = await supabaseClient.storage.from('media_files').upload(mediaPath, mediaFile);
          if (mediaErr) throw mediaErr;

          const { data: mediaUrlData } = supabaseClient.storage.from('media_files').getPublicUrl(mediaPath);
          finalMediaUrl = mediaUrlData.publicUrl;
        }

        let finalPosterUrl = posterUrlInput;
        if (posterFile) {
          const posterPath = `${currentUser.id}/${timestamp}_poster.${posterFile.name.split('.').pop()}`;
          const { error: posterErr } = await supabaseClient.storage.from('images').upload(posterPath, posterFile);
          if (!posterErr) {
            const { data } = supabaseClient.storage.from('images').getPublicUrl(posterPath);
            finalPosterUrl = data.publicUrl;
          }
        }

        const { error: dbErr } = await supabaseClient.from('media').insert([{
          user_id: currentUser.id, title, description: finalDescription, category, media_type: mediaType,
          media_url: finalMediaUrl, poster_url: finalPosterUrl, views_count: 0
        }]);

        if (dbErr) throw dbErr;
        
        alert('Media successfully published!');
        closeModal('uploadModal');
        
        // Reset the form values securely
        document.getElementById('upTitle').value = '';
        document.getElementById('upFile').value = '';
        document.getElementById('upDirectMediaUrl').value = '';
        document.getElementById('upPosterFile').value = '';
        document.getElementById('upPosterUrl').value = '';
        document.getElementById('upDesc').value = '';
        document.getElementById('upCustomLinkText').value = '';
        document.getElementById('upCustomLinkUrl').value = '';
        
        await fetchMediaFeed();
        showHomeView();
      } catch (err) { 
          alert('Upload failed: ' + err.message); 
      } finally { 
          uploadBtn.disabled = false; uploadBtn.innerText = 'Publish Media'; 
      }
    }

    function createVideoCardHTML(v) {
      let logoContent = v.authorAvatar 
        ? `<img src="${v.authorAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
        : `<div style="font-size:11px; font-weight:bold;">${v.author.charAt(0)}</div>`;

      let mediaBadge = v.mediaType === 'audio' ? `<span class="media-badge">🎵 Audio</span>` : `<span class="media-badge">🎬 Video</span>`;
      let defaultCover = v.posterUrl || (v.mediaType === 'audio' ? 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80' : 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&q=80');

      let favStatusIcon = userFavorites.includes(v.id) ? iconStar : iconStarOutline;
      let favButton = (!isAdmin && currentUser) ? `<div class="fav-btn" onclick="toggleFav(event, '${v.id}')" title="Save to Favorites">${favStatusIcon}</div>` : '';
      let canDelete = isAdmin || (currentUser && currentUser.id === v.authorId);
      let adminDeleteButton = canDelete ? `<button class="admin-del-btn" onclick="deleteMediaItem(event, '${v.id}')">🗑️ Delete</button>` : '';

      return `
        <div class="video-card" onclick="playVideo('${v.id}')" onmouseenter="hoverPlay(this)" onmouseleave="hoverStop(this)">
          ${favButton}
          ${mediaBadge}
          ${adminDeleteButton}
          <div class="thumbnail-container">
            <img src="${defaultCover}">
            ${v.mediaType === 'video' ? `<video src="${v.mediaUrl}" loop muted preload="none"></video>` : ''}
          </div>
          <div class="card-details">
            <div class="avatar-wrapper" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;" onclick="event.stopPropagation(); openProfile('${v.authorId}')">
              ${logoContent}
            </div>
            <div class="card-text">
              <div class="card-title">${v.title}</div>
              <div class="card-author">${v.author}</div>
              <div class="card-metrics">${v.views} • ${v.timeAgo}</div>
              <div class="card-metrics-extra">
                <div style="display:flex; align-items:center; gap:4px;">${iconLike} ${v.likedBy.length}</div>
                <div style="display:flex; align-items:center; gap:4px;">${iconShare} ${v.shares}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function createCompactCardHTML(v) {
      let defaultCover = v.posterUrl || (v.mediaType === 'audio' ? 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&q=80' : 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=300&q=80');
      let mediaBadge = v.mediaType === 'audio' ? '🎵' : '🎬';
      let canDelete = isAdmin || (currentUser && currentUser.id === v.authorId);
      let deleteBtn = canDelete ? `<button class="admin-del-btn" style="position:static; margin-top:6px; padding:4px 8px; font-size:10px; width: fit-content;" onclick="deleteMediaItem(event, '${v.id}')">🗑️ Delete</button>` : '';

      return `
        <div class="compact-card" onclick="playVideo('${v.id}')">
          <div class="compact-thumb">
            <img src="${defaultCover}">
            <span class="media-badge" style="font-size:9px; padding:2px 4px; top:4px; right:4px;">${mediaBadge}</span>
          </div>
          <div class="compact-info">
            <div class="compact-title">${v.title}</div>
            <div class="compact-author">${v.author}</div>
            <div class="compact-metrics">${v.views} • ${v.timeAgo}</div>
            ${deleteBtn}
          </div>
        </div>
      `;
    }

    function showHomeView() {
      pauseCurrentMedia();
      document.getElementById('watchView').style.display = 'none';
      document.getElementById('profileView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('categoriesBar').style.display = 'flex';
      renderHomeVideos();
      window.scrollTo(0, 0);
    }

    function renderHomeVideos() {
      let query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = videos.filter(v => {
        let matchCat = (activeCategory === 'All') || (activeCategory === 'Audio' && v.mediaType === 'audio') || (v.category === activeCategory);
        let matchStr = v.title.toLowerCase().includes(query) || v.category.toLowerCase().includes(query);
        return matchCat && matchStr;
      });

      document.getElementById('homeSectionTitle').innerText = activeCategory === 'All' ? 'All Media Content' : `${activeCategory}`;
      document.getElementById('homeVideoGrid').innerHTML = filtered.length 
        ? filtered.map(v => createVideoCardHTML(v)).join('') 
        : `<div style="grid-column: 1/-1; color: var(--text-sub);">No media found</div>`;
    }

    function playVideo(id) {
      const media = videos.find(v => v.id === id);
      if (!media) return;
      currentVideo = media;
      pauseCurrentMedia();

      document.getElementById('homeView').style.display = 'none';
      document.getElementById('profileView').style.display = 'none';
      document.getElementById('categoriesBar').style.display = 'none';
      document.getElementById('watchView').style.display = 'grid';
      
      const playerContainer = document.getElementById('playerContainer');
      const overlayLogo = `
        <div class="player-logo-overlay">
          <span class="logo-p">P</span><span class="logo-i">I</span><span class="logo-l">L</span><span class="logo-c">C</span><span class="logo-t">T</span>
        </div>
      `;
      
      if (media.mediaType === 'audio') {
        let cover = media.posterUrl || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80';
        playerContainer.innerHTML = `
          <div class="audio-player-container">
            <img src="${cover}" class="audio-cover-center" alt="Audio Cover Photo">
            <div class="audio-controls-wrapper">
              <audio id="mainPlayer" controls autoplay controlsList="nodownload">
                <source src="${media.mediaUrl}">
              </audio>
            </div>
          </div>
          ${overlayLogo}
        `;
      } else {
        playerContainer.innerHTML = `
          <video id="mainPlayer" controls autoplay style="width:100%; height:100%;">
            <source src="${media.mediaUrl}">
          </video>
          ${overlayLogo}
        `;
      }
      
      document.getElementById('activeTitle').innerText = media.title;
      document.getElementById('activeAuthor').innerText = media.author;
      document.getElementById('activeDesc').innerHTML = linkify(media.description);
      document.getElementById('activeCategory').innerText = (media.mediaType === 'audio' ? '🎵 Audio' : '🎬 Video') + " • " + media.category;
      document.getElementById('activeChannelWrapper').onclick = () => openProfile(media.authorId);

      let avatarElem = document.getElementById('activeAvatar');
      avatarElem.innerHTML = media.authorAvatar 
        ? `<img src="${media.authorAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`
        : media.author.charAt(0);

      renderVideoActions();
      
      document.getElementById('authorMoreTitle').innerText = `More from ${media.author}`;
      let authorVideos = videos.filter(v => v.authorId === media.authorId && v.id !== id);
      document.getElementById('watchAuthorGrid').innerHTML = authorVideos.length 
        ? authorVideos.map(v => createVideoCardHTML(v)).join('') 
        : '<div style="color:var(--text-sub);">No other uploads available from this user.</div>';

      window.sidebarVideoId = id;
      renderSidebar();
      window.scrollTo(0, 0);
    }

    function setSidebarFilter(filter) {
      sidebarFilter = filter;
      document.getElementById('tabUpNextTrending').classList.toggle('active', filter === 'trending');
      document.getElementById('tabUpNextLatest').classList.toggle('active', filter === 'latest');
      renderSidebar();
    }

    function renderSidebar() {
      if (!window.sidebarVideoId) return;
      let filtered = videos.filter(v => v.id !== window.sidebarVideoId);
      
      if (sidebarFilter === 'trending') {
        filtered.sort((a, b) => (b.likedBy.length + b.shares) - (a.likedBy.length + a.shares));
      } else {
        filtered = videos.filter(v => v.id !== window.sidebarVideoId); 
      }
      document.getElementById('suggestedList').innerHTML = filtered.map(v => createCompactCardHTML(v)).join('');
    }

    function renderVideoActions() {
      if (!currentVideo) return;
      let isLiked = currentUser && currentVideo.likedBy.includes(currentUser.id);
      document.getElementById('videoInteractions').innerHTML = `
        <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${currentVideo.id}')">
          <span class="icon-like">${iconLike}</span> <span>${currentVideo.likedBy.length}</span>
        </button>
        <button class="action-btn" onclick="triggerShare('${currentVideo.id}')">
          <span class="icon-share">${iconShare}</span> <span>${currentVideo.shares}</span>
        </button>
      `;
    }

    async function toggleFav(e, mediaId) {
      e.stopPropagation();
      if (!currentUser || isAdmin) return alert('Sign in as regular user to save favorites.');
      const isFav = userFavorites.includes(mediaId);
      if (isFav) {
        userFavorites = userFavorites.filter(id => id !== mediaId);
        await supabaseClient.from('favorites').delete().eq('user_id', currentUser.id).eq('media_id', mediaId);
      } else {
        userFavorites.push(mediaId);
        await supabaseClient.from('favorites').insert([{ user_id: currentUser.id, media_id: mediaId }]);
      }
      renderHomeVideos(); if (document.getElementById('profileView').style.display === 'block') renderProfileVideos();
    }
    
    async function toggleLike(mediaId) {
      if (!currentUser || isAdmin) return;
      const { data: existing } = await supabaseClient.from('likes').select('*').eq('user_id', currentUser.id).eq('media_id', mediaId).single();
      if (existing) await supabaseClient.from('likes').delete().eq('user_id', currentUser.id).eq('media_id', mediaId);
      else await supabaseClient.from('likes').insert([{ user_id: currentUser.id, media_id: mediaId }]);
      await fetchMediaFeed();
      if (currentVideo && currentVideo.id === mediaId) { currentVideo = videos.find(v => v.id === mediaId); renderVideoActions(); }
    }
    
    async function triggerShare(mediaId) {
      await supabaseClient.from('shares').insert([{ media_id: mediaId }]);
      await fetchMediaFeed();
      if (currentVideo && currentVideo.id === mediaId) { currentVideo = videos.find(v => v.id === mediaId); renderVideoActions(); }
      alert(`Share link copied: ${window.location.href.split('?')[0]}?v=${mediaId}`);
    }

    function linkify(text) {
      if (!text) return '';
      return text.replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig, '<a href="$1" target="_blank">$1</a>')
        .replace(/\n/g, '<br>');
    }

    function renderHeaderActions() {
      const container = document.getElementById('userActions');
      if (currentUser) {
        let avatarContent = currentUserProfile?.avatar_url && !isAdmin
          ? `<img src="${currentUserProfile.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
          : (currentUserProfile?.full_name || currentUser.email).charAt(0).toUpperCase();

        let extraButtons = isAdmin 
          ? `<span style="color:var(--accent); font-weight:bold; font-size:12px; margin-right:8px;">Admin Mode</span>`
          : `<button class="btn btn-secondary" onclick="openChannelModal()">Edit Profile</button>
             <button class="btn btn-primary" onclick="openModal('uploadModal')">+ Upload</button>`;

        container.innerHTML = `
          ${extraButtons}
          <div class="avatar" style="width:36px;height:36px;font-size:14px;" ${isAdmin ? '' : `onclick="openProfile('${currentUser.id}')"`}>
            ${avatarContent}
          </div>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        `;
      } else {
        container.innerHTML = `
          <button class="btn-modern-auth" onclick="openModal('authModal')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Sign In
          </button>
        `;
      }
    }

    function renderCategories() {
      document.getElementById('categoriesBar').innerHTML = INITIAL_CATEGORIES.map(cat => `<div class="chip ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</div>`).join('');
    }

    async function openProfile(authorId) {
      pauseCurrentMedia(); currentProfileId = authorId; activeProfileCategory = 'All'; activeProfileTab = 'Home';
      document.getElementById('homeView').style.display = 'none'; document.getElementById('watchView').style.display = 'none'; document.getElementById('categoriesBar').style.display = 'none'; document.getElementById('profileView').style.display = 'block';
      const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', authorId).single();
      currentProfileData = prof || { full_name: 'Creator', username: 'user', bio: '', avatar_url: '', banner_url: '', links: [] };
      document.getElementById('profileName').innerText = currentProfileData.full_name || currentProfileData.username;
      document.getElementById('profileBio').innerHTML = linkify(currentProfileData.bio);
      document.getElementById('profileBanner').style.backgroundImage = currentProfileData.banner_url ? `url(${currentProfileData.banner_url})` : 'none';
      const avatarDiv = document.getElementById('profileAvatar');
      avatarDiv.style.backgroundImage = currentProfileData.avatar_url ? `url(${currentProfileData.avatar_url})` : 'none';
      avatarDiv.innerText = currentProfileData.avatar_url ? '' : (currentProfileData.full_name || 'U').charAt(0).toUpperCase();
      document.getElementById('profileLinks').innerHTML = (currentProfileData.links || []).map(l => `<a href="${l.url}" target="_blank" class="profile-link-badge"><span>🌐</span> ${l.title || 'Link'}</a>`).join('');
      renderProfileCategories(); renderProfileVideos(); window.scrollTo(0, 0);
    }
    
    function switchProfileTab(tabName, elem) { activeProfileTab = tabName; document.querySelectorAll('.profile-nav-item').forEach(el => el.classList.remove('active')); elem.classList.add('active'); renderProfileVideos(); }
    function renderProfileCategories() { const bar = document.getElementById('profileCategoriesBar'); if (activeProfileTab === 'Favorites') bar.innerHTML = ''; else bar.innerHTML = INITIAL_CATEGORIES.map(cat => `<div class="chip ${cat === activeProfileCategory ? 'active' : ''}" onclick="selectProfileCategory('${cat}')">${cat}</div>`).join(''); }
    function selectProfileCategory(cat) { activeProfileCategory = cat; renderProfileCategories(); renderProfileVideos(); }
    function renderProfileVideos() {
      let query = document.getElementById('profileSearchInput').value.toLowerCase();
      let sourceVideos = activeProfileTab === 'Favorites' ? videos.filter(v => userFavorites.includes(v.id)) : videos.filter(v => v.authorId === currentProfileId);
      let filtered = sourceVideos.filter(v => {
        if (activeProfileTab === 'Favorites') return v.title.toLowerCase().includes(query);
        let matchTab = (activeProfileTab === 'Home') || (activeProfileTab === 'Videos' && v.mediaType !== 'audio') || (activeProfileTab === 'Audio' && v.mediaType === 'audio');
        let matchCat = (activeProfileCategory === 'All') || (v.category === activeProfileCategory);
        let matchStr = v.title.toLowerCase().includes(query) || v.category.toLowerCase().includes(query);
        return matchTab && matchCat && matchStr;
      });
      document.getElementById('profileVideoGrid').innerHTML = filtered.length ? filtered.map(v => createVideoCardHTML(v)).join('') : `<div style="grid-column: 1/-1;">No media found.</div>`;
    }

    function selectCategory(cat) { activeCategory = cat; renderCategories(); showHomeView(); }
    function handleSearch() { if(document.getElementById('homeView').style.display === 'none') showHomeView(); renderHomeVideos(); }
    function resetToHome() { activeCategory = 'All'; document.getElementById('searchInput').value = ''; renderCategories(); showHomeView(); }
    function pauseCurrentMedia() { let player = document.getElementById('mainPlayer'); if (player) player.pause(); }
    function hoverPlay(el) { if (window.matchMedia('(hover: hover)').matches) { let v = el.querySelector('video'); if(v) { v.currentTime = 0; v.play().catch(()=>{}); } } }
    function hoverStop(el) { let v = el.querySelector('video'); if(v) v.pause(); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    
    function openChannelModal() {
      if(currentUserProfile) {
        document.getElementById('chName').value = currentUserProfile.full_name || '';
        document.getElementById('chBio').value = currentUserProfile.bio || '';
        document.getElementById('customLinksContainer').innerHTML = '';
        if(currentUserProfile.links) {
          currentUserProfile.links.forEach(l => {
            addLinkInputRow(l.title, l.url);
          });
        }
      }
      openModal('channelModal'); 
    }

    function addLinkInputRow(title = '', url = '') {
      const container = document.getElementById('customLinksContainer');
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <input type="text" placeholder="Link Title" class="link-title" value="${title}">
        <input type="url" placeholder="https://..." class="link-url" value="${url}">
        <button class="btn btn-danger" onclick="this.parentElement.remove()" style="padding: 6px;">X</button>
      `;
      container.appendChild(row);
    }

    async function saveChannelProfile() {
      if (!currentUser) return;
      const btn = document.getElementById('saveProfileBtn');
      btn.disabled = true; btn.innerText = 'Saving...';
      
      try {
        const name = document.getElementById('chName').value.trim();
        const bio = document.getElementById('chBio').value.trim();
        const logoFile = document.getElementById('chLogoFile').files[0];
        const bannerFile = document.getElementById('chBannerFile').files[0];
        
        let updates = { full_name: name, bio: bio };
        
        if (logoFile) {
          const path = `${currentUser.id}/avatar_${Date.now()}`;
          await supabaseClient.storage.from('images').upload(path, logoFile);
          updates.avatar_url = supabaseClient.storage.from('images').getPublicUrl(path).data.publicUrl;
        }
        if (bannerFile) {
          const path = `${currentUser.id}/banner_${Date.now()}`;
          await supabaseClient.storage.from('images').upload(path, bannerFile);
          updates.banner_url = supabaseClient.storage.from('images').getPublicUrl(path).data.publicUrl;
        }
        
        const links = Array.from(document.querySelectorAll('.link-row')).map(row => ({
           title: row.querySelector('.link-title').value.trim(),
           url: row.querySelector('.link-url').value.trim()
        })).filter(l => l.title && l.url);
        
        updates.links = links;
        
        const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUser.id);
        if(error) throw error;
        
        alert('Profile updated successfully!');
        closeModal('channelModal');
        await loadCurrentUserProfile();
        renderHeaderActions();
        
        if (document.getElementById('profileView').style.display === 'block') {
          openProfile(currentUser.id);
        }
      } catch (e) {
         alert('Error saving profile: ' + e.message);
      } finally {
         btn.disabled = false; btn.innerText = 'Save Profile';
      }
    }
  </script>
</body>
</html>
